# Fast checks run on every commit; the Rust tests run on push.
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  # Third-party asset files (licenses, readmes) are kept as shipped.
  { id = "trailing-whitespace", exclude = "^src/assets/.*\\.txt$" },
  { id = "end-of-file-fixer", exclude = "^src/assets/.*\\.txt$" },
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = "^src/assets/.*\\.txt$" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt", name = "cargo fmt", language = "system", entry = "cargo fmt --all --check", types = ["rust"], pass_filenames = false },
  { id = "cargo-clippy", name = "cargo clippy", language = "system", entry = "cargo clippy --locked --all-targets -- -D warnings", types = ["rust"], pass_filenames = false },
  { id = "typstyle", name = "typstyle", language = "system", entry = "typstyle --diff", files = "^art/.*\\.typ$" },
  { id = "cargo-test", name = "cargo test", language = "system", entry = "cargo test --locked", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]
