name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun ci
      - name: Run checks
        run: bun run check
