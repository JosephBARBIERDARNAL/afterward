name: Validate game data YAML

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-yaml:
    name: Validate game data YAML
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Parse game data YAML files
        run: ruby scripts/validate_yaml.rb
