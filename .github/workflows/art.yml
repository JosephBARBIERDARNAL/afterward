name: Typst art

# Checks the Typst sources in art/ are formatted with typstyle, re-renders
# them, and fails if a committed PNG under src/assets/ differs from its
# source (edited without `just art`) or a rendered PNG was never committed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TYPST_VERSION: 0.15.1
  TYPSTYLE_VERSION: 0.15.2

jobs:
  art:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install Typst
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar --extract --xz --strip-components=1 --directory /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version

      - name: Install typstyle
        run: |
          sudo curl --fail --location --silent --show-error --output /usr/local/bin/typstyle \
            "https://github.com/typstyle-rs/typstyle/releases/download/v${TYPSTYLE_VERSION}/typstyle-x86_64-unknown-linux-musl"
          sudo chmod +x /usr/local/bin/typstyle
          typstyle --version

      - name: Check Typst formatting
        # Prints the diff and fails if any source needs formatting.
        run: typstyle --diff art

      - name: Render art
        run: just art

      - name: Check rendered PNGs are committed and current
        run: |
          stale="$(git status --porcelain -- src/assets)"
          if [ -n "$stale" ]; then
            echo "These assets differ from their Typst sources in art/:"
            echo "$stale"
            echo "Run 'just art' and commit the PNGs."
            exit 1
          fi
