# Colorways: the sci-fi art redrawn in other colors, so a stretch of the run
# feels like another part of the city without new art. A platform,
# decoration, prop or device takes one with `colorway:` in its room entry
# (the editor's Colorway row, or the swatches at the top of the palette);
# left out, it keeps the pack's own colors.
#
# Every image a material, a prop or a device is drawn with is recolored once
# as the game starts. Each color of it is changed by the first shift whose
# hues hold it (`hue_deg: [from, to]`, read round the wheel, and at least
# `min_saturation` saturated): its hue turned by `rotate_deg`, its saturation
# and lightness multiplied by `saturation` and `lightness`. A color no shift
# holds (the greys, the white of a light) is kept.
#
# The pack is drawn in four families, which every colorway below shifts:
# - glow: the bright cyan of the screens and lights, hues 165 to 200 and
#   saturated, listed first so the trim's shift leaves it alone;
# - steel: the blue-grey of every wall, floor and frame, hues 195 to 260;
# - trim: the green of the trims, belts and panels, hues 85 to 195;
# - warm: the rust and orange of crates and barrels and the red of a laser,
#   hues 330 to 45.
#
# Made for rooms 11 to 20, under the pale pink sky of `dead_city_ephemeral`.

colorways:
  # Plum steel, rose trim: the sky's own colors, darkened.
  dusk:
    swatch: "#C2457E"
    shifts:
      - label: glow
        hue_deg: [165, 200]
        min_saturation: 0.6
        rotate_deg: 90
      - label: steel
        hue_deg: [195, 260]
        rotate_deg: 65
        saturation: 0.9
      - label: trim
        hue_deg: [85, 195]
        min_saturation: 0.25
        rotate_deg: -170
        saturation: 1.1
      - label: warm
        hue_deg: [330, 45]
        min_saturation: 0.25
        rotate_deg: -25

  # Brown steel, amber trim: a scorched, rusted quarter.
  rust:
    swatch: "#D0802E"
    shifts:
      - label: glow
        hue_deg: [165, 200]
        min_saturation: 0.6
        rotate_deg: -150
      - label: steel
        hue_deg: [195, 260]
        rotate_deg: 155
        saturation: 0.75
      - label: trim
        hue_deg: [85, 195]
        min_saturation: 0.25
        rotate_deg: -115
        saturation: 1.3
        lightness: 1.1
      - label: warm
        hue_deg: [330, 45]
        min_saturation: 0.25
        rotate_deg: 180
        saturation: 0.8

  # Slate steel, ice-blue trim: a cold, flooded quarter.
  frost:
    swatch: "#5CC8E6"
    shifts:
      - label: glow
        hue_deg: [165, 200]
        min_saturation: 0.6
        rotate_deg: 0
        lightness: 1.1
      - label: steel
        hue_deg: [195, 260]
        rotate_deg: -35
        saturation: 0.5
        lightness: 1.8
      - label: trim
        hue_deg: [85, 195]
        min_saturation: 0.25
        rotate_deg: 60
        saturation: 1.1
        lightness: 1.15
      - label: warm
        hue_deg: [330, 45]
        min_saturation: 0.25
        rotate_deg: -60
        saturation: 0.7

  # Charcoal steel, sulfur-yellow trim: an industrial, poisoned quarter.
  sulfur:
    swatch: "#D8C23A"
    shifts:
      - label: glow
        hue_deg: [165, 200]
        min_saturation: 0.6
        rotate_deg: -65
      - label: steel
        hue_deg: [195, 260]
        rotate_deg: 170
        saturation: 0.25
      - label: trim
        hue_deg: [85, 195]
        min_saturation: 0.25
        rotate_deg: -82
        saturation: 1.2
        lightness: 1.35
      - label: warm
        hue_deg: [330, 45]
        min_saturation: 0.25
        rotate_deg: 270
        saturation: 0.7
