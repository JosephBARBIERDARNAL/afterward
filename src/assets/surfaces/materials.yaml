# Surface materials: how platforms and decoration panels look and
# sound. Room files name one material per block (`material:`), or paint a
# plain color instead (`color: "#RRGGBB"`).
#
# Every texture is a seamless 16 px square, drawn in Typst (art/surfaces/,
# rendered by `just art`) or cut from a pack (`sci_fi_*`). They tile in world
# space, so neighboring blocks of one material line up.

texture_px: 16
# One 16 px tile spans 0.25 H (64 px per H), close to the player sprite's
# pixel density (60 px per H), and matches the editor's 0.25 H grid. A
# material drawn at another scale says so with its own `tile_h`.
texture_tile_h: 0.25

# Drawn along every block edge that no other block covers, so blocks read
# clearly against the backgrounds. Thicknesses are in texture pixels.
#
# The highlight is the wet sheen of a drowned city: cold emergency-strip
# light caught along every exposed edge, not a white rim. It is what makes a
# surface read as wet without a single new texture.
edges:
  outline_color: "#08070F"
  outline_alpha: 0.9
  outline_px: 1
  highlight_color: "#6FD3E8"
  highlight_alpha: 0.28
  highlight_px: 1

# Decoration panels are non-solid. Background panels sit behind the platforms
# and are tinted darker so they read as distant; foreground panels are drawn
# over the bodies.
decoration_layers:
  background:
    tint: "#5A5478"
    alpha: 1
  foreground:
    tint: "#FFFFFF"
    alpha: 1

# The footstep a plain-color block makes, since it names no material.
color_footstep: stone

materials:
  # City: the streets and floors of the drowned city.
  city_pavement:
    texture: surfaces/textures/city/pavement.png
    footstep: stone
  city_conduit_grid:
    texture: surfaces/textures/city/conduit_grid.png
    footstep: stone
  city_plating:
    texture: surfaces/textures/city/plating.png
    footstep: stone

  # Metal.
  metal_plates:
    texture: surfaces/textures/metal/plates.png
    footstep: stone
  metal_corroded_plates:
    texture: surfaces/textures/metal/corroded_plates.png
    footstep: stone
  metal_tread:
    texture: surfaces/textures/metal/tread.png
    footstep: stone
  metal_grate:
    texture: surfaces/textures/metal/grate.png
    footstep: stone

  # Carved stone.
  carved_ashlar:
    texture: surfaces/textures/carved/ashlar.png
    footstep: stone
  carved_frieze:
    texture: surfaces/textures/carved/frieze.png
    footstep: stone
  carved_pillar:
    texture: surfaces/textures/carved/pillar.png
    footstep: stone

  # Wood.
  wood_planks:
    texture: surfaces/textures/wood/planks.png
    footstep: wood
  wood_dark_planks:
    texture: surfaces/textures/wood/dark_planks.png
    footstep: wood
  wood_crate:
    texture: surfaces/textures/wood/crate.png
    footstep: wood

  # Sci-fi: tiles cut from the sci-fi platformer pack (scripts/
  # slice_sci_fi_tileset.py), drawn at the pack's 16 px per H.
  sci_fi_dark:
    texture: surfaces/textures/sci_fi/dark.png
    footstep: stone
    tile_h: 1
  sci_fi_dark_rivets:
    texture: surfaces/textures/sci_fi/dark_rivets.png
    footstep: stone
    tile_h: 1
  sci_fi_riveted_wall:
    texture: surfaces/textures/sci_fi/riveted_wall.png
    footstep: stone
    tile_h: 1

# Props: pixel-art sprites a platform or decoration is painted with instead
# of a material (`prop: sci_fi_small_crate`). One is drawn from the block's
# top-left corner and repeats across a block bigger than itself, so a block
# exactly `size_px` big shows it once, and a wider one lays a row of it (a
# belt, a run of spikes). A prop has no outline of its own drawn round it, and
# a prop platform is as solid as its whole rectangle, transparent corners
# included. The editor adds one at its own size with O.
#
# The sci-fi pack's pieces (scripts/slice_sci_fi_tileset.py) are free for
# non-commercial use only: see props/sci_fi/LICENSE.txt.
prop_px_per_h: 16

props:
  sci_fi_green_window:
