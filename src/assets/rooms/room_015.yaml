# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 15
chapter_id: 2
size:
  width_h: 30
  height_h: 14
background_profiles: [dead_city_ephemeral]
hidden_background_layers: [dead_city_ephemeral/4, dead_city_ephemeral/5]
player_spawn:
  x_h: 2.5
  y_h: 3.5
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0, width: 30, height: 0.5 }
    colorway: dusk
  - material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0.5, width: 6.5, height: 2.5 }
    colorway: dusk
  - material: sci_fi_green_edge
    rect_h: { x: 7, y: 0.5, width: 16, height: 0.5 }
    colorway: dusk
  - material: sci_fi_dark_rivets
    rect_h: { x: 23.5, y: 0.5, width: 6.5, height: 2.5 }
    colorway: dusk
  - material: sci_fi_trim_wall_right
    rect_h: { x: 6.5, y: 1, width: 0.5, height: 2 }
    colorway: dusk
  - material: sci_fi_trim_wall_left
    rect_h: { x: 23, y: 1, width: 0.5, height: 2 }
    colorway: dusk
  - material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 3, width: 0.5, height: 11 }
    colorway: dusk
  - material: sci_fi_green_edge
    rect_h: { x: 1, y: 3, width: 5.5, height: 0.5 }
    colorway: dusk
  - material: sci_fi_green_edge
    rect_h: { x: 23.5, y: 3, width: 5.5, height: 0.5 }
    colorway: dusk
  - material: sci_fi_dark_rivets
    rect_h: { x: 29.5, y: 3, width: 0.5, height: 11 }
    colorway: dusk
  - material: sci_fi_trim_wall_right
    rect_h: { x: 0.5, y: 3.5, width: 0.5, height: 10.5 }
    colorway: dusk
  - material: sci_fi_trim_wall_left
    rect_h: { x: 29, y: 3.5, width: 0.5, height: 10.5 }
    colorway: dusk
  - material: sci_fi_green_edge
    rect_h: { x: 8, y: 5, width: 1.5, height: 0.5 }
    colorway: dusk
  - material: sci_fi_green_edge
    rect_h: { x: 20.5, y: 5, width: 1.5, height: 0.5 }
    colorway: dusk
  - material: sci_fi_trim_ceiling
    rect_h: { x: 11.5, y: 6.5, width: 7, height: 0.5 }
    colorway: dusk
  - material: sci_fi_green_edge
    rect_h: { x: 11.5, y: 7, width: 7, height: 0.5 }
    colorway: dusk
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
# Props: sprites standing on a spot (the middle of their bottom edge).
props:
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 6.75, y: 0.5 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 23.25, y: 0.5 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 0.75, y: 3 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 6.75, y: 3 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 23.25, y: 3 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 29.25, y: 3 }
    colorway: dusk
  - label: corner
