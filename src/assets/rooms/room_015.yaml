    position_h: { x: 9.75, y: 5 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 20.25, y: 5 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 22.25, y: 5 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 11.25, y: 6.5 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 18.75, y: 6.5 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 11.25, y: 7 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 18.75, y: 7 }
    colorway: dusk
  - prop: sci_fi_framed_fan
    position_h: { x: 4, y: 1.75 }
    colorway: dusk
  - prop: sci_fi_framed_fan
    position_h: { x: 26, y: 1.75 }
    colorway: dusk
  - prop: sci_fi_pipe_vertical
    position_h: { x: 0.5, y: 6 }
    colorway: dusk
  - prop: sci_fi_pipe_vertical
    position_h: { x: 29.5, y: 6 }
    colorway: dusk
  - prop: sci_fi_barrel
    position_h: { x: 12, y: 7.5 }
    solid: false
    opacity: 0.8
    colorway: dusk
# Devices: traps, moving and folding platforms, buttons, doors and
# ladders, each standing on a spot (the middle of its bottom edge).
devices:
  - kind: terminal
    position_h: { x: 5.25, y: 3.5 }
    text: "WARDEN UNIT. STILL ON DUTY."
    colorway: dusk
  - label: the beam under the west slab
    kind: laser
    position_h: { x: 8.75, y: 1 }
    color: red
    orientation: vertical
    length_h: 4
    off_s: 1.8
    warn_s: 0.5
    on_s: 1
    offset_s: 0
    damage: 15
    colorway: dusk
  - label: the beam under the east slab
    kind: laser
    position_h: { x: 21.25, y: 1 }
    color: red
    orientation: vertical
    length_h: 4
    off_s: 1.8
    warn_s: 0.5
    on_s: 1
    offset_s: 1.2
    damage: 15
    colorway: dusk
  - kind: light_strip
    position_h: { x: 15, y: 1.25 }
    orientation: horizontal
    length_h: 8
    colorway: dusk
enemy_spawns:
  - label: the warden
    type_id: abomination_gold
    position_h: { x: 16, y: 1 }
    facing: left
    armor_layers: 3
  - type_id: catto
    position_h: { x: 12.5, y: 1 }
    facing: left
  - type_id: catto
    position_h: { x: 19, y: 1 }
    facing: left
  - type_id: mage_gold
    position_h: { x: 15, y: 7.5 }
    facing: left
    wave: 1
  - type_id: catto_gold
    position_h: { x: 8.75, y: 5.5 }
    facing: left
    wave: 1
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 25.75
  y_h: 3.5
exit:
  x_h: 27
  y_h: 3.5
next_room_id: 16
