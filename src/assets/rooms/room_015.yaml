# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 15
chapter_id: 2
size:
  width_h: 32
  height_h: 16
background_profiles: [dead_city_ephemeral]
hidden_background_layers: [dead_city_ephemeral/4, dead_city_ephemeral/5]
player_spawn:
  x_h: 2.5
  y_h: 8
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0, width: 0.5, height: 16 }
    colorway: dusk
  - material: sci_fi_dark_rivets
    rect_h: { x: 1, y: 0, width: 30, height: 0.5 }
    colorway: dusk
  - material: sci_fi_dark_rivets
    rect_h: { x: 31.5, y: 0, width: 0.5, height: 16 }
    colorway: dusk
  - material: sci_fi_trim_wall_right
    rect_h: { x: 0.5, y: 0.5, width: 0.5, height: 15 }
    colorway: dusk
  - material: sci_fi_green_edge
    rect_h: { x: 1, y: 0.5, width: 30, height: 0.5 }
    colorway: dusk
  - material: sci_fi_trim_wall_left
    rect_h: { x: 31, y: 0.5, width: 0.5, height: 15 }
    colorway: dusk
  - material: sci_fi_dark_rivets
    rect_h: { x: 14.5, y: 1, width: 3, height: 1 }
    colorway: dusk
  - material: sci_fi_trim_wall_left
    rect_h: { x: 14, y: 1.5, width: 0.5, height: 0.5 }
    colorway: dusk
  - material: sci_fi_trim_wall_right
    rect_h: { x: 17.5, y: 1.5, width: 0.5, height: 0.5 }
    colorway: dusk
  - material: sci_fi_green_edge
    rect_h: { x: 14.5, y: 2, width: 3, height: 0.5 }
    colorway: dusk
  - material: sci_fi_trim_ceiling
    rect_h: { x: 1, y: 7, width: 6.5, height: 0.5 }
    colorway: dusk
  - material: sci_fi_trim_ceiling
    rect_h: { x: 25.5, y: 7.25, width: 5.5, height: 0.25 }
    colorway: dusk
  - material: sci_fi_green_edge
    rect_h: { x: 1, y: 7.5, width: 6.5, height: 0.5 }
    colorway: dusk
  - material: sci_fi_green_edge
    rect_h: { x: 25.5, y: 7.5, width: 5.5, height: 0.5 }
    colorway: dusk
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
# Props: sprites standing on a spot (the middle of their bottom edge).
props:
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 0.75, y: 0 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 31.25, y: 0 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 14.25, y: 1 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 17.75, y: 1 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 14.25, y: 2 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 17.75, y: 2 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 7.75, y: 7 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 25.25, y: 7 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 7.75, y: 7.5 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 25.25, y: 7.5 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 0.75, y: 15.5 }
    colorway: dusk
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 31.25, y: 15.5 }
    colorway: dusk
  - prop: sci_fi_pipe_vertical
    position_h: { x: 0.5, y: 10 }
    colorway: dusk
  - prop: sci_fi_pipe_vertical
    position_h: { x: 31.5, y: 10 }
    colorway: dusk
  - prop: sci_fi_ceiling_lamp
    position_h: { x: 4, y: 6.5 }
    colorway: dusk
  - prop: sci_fi_barrel
    position_h: { x: 1.5, y: 1 }
    solid: false
    opacity: 0.8
    colorway: dusk
  - prop: sci_fi_crate_stack
    position_h: { x: 30, y: 1 }
    solid: false
    opacity: 0.8
    colorway: dusk
# Devices: traps, moving and folding platforms, buttons, doors and
# ladders, each standing on a spot (the middle of its bottom edge).
devices:
  - kind: terminal
    position_h: { x: 2.5, y: 1 }
    text: WARDEN UNIT. STILL ON DUTY.
    colorway: dusk
  - label: the ferry
    kind: hover_platform
    position_h: { x: 10.5, y: 7 }
    size: large
    travel_x_h: 12.5
    travel_y_h: 0
    speed_h_s: 2
    colorway: dusk
  - label: west perch
    kind: folding_platform
    position_h: { x: 5.5, y: 3 }
    color: steel
    stand_s: 0.6
    return_s: 2.5
    colorway: dusk
  - label: east perch
    kind: folding_platform
    position_h: { x: 26.5, y: 3 }
    color: steel
    stand_s: 0.6
    return_s: 2.5
    colorway: dusk
  - label: up to the way in
    kind: ladder
    position_h: { x: 8.25, y: 1 }
    height_h: 7
    colorway: dusk
  - label: up to the way out
    kind: ladder
    position_h: { x: 24.75, y: 1 }
    height_h: 7
    colorway: dusk
enemy_spawns:
  - label: the warden
    type_id: abomination_gold
    position_h: { x: 20.5, y: 1 }
    facing: left
    armor_layers: 3
  - type_id: catto
    position_h: { x: 11.5, y: 1 }
    facing: left
  - type_id: catto
    position_h: { x: 22.5, y: 1 }
    facing: left
  - type_id: mage_gold
    position_h: { x: 28.5, y: 8 }
    facing: left
    wave: 1
  - type_id: catto_gold
    position_h: { x: 16, y: 2.5 }
    facing: left
    wave: 1
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 27
  y_h: 8
exit:
  x_h: 29.5
  y_h: 8
next_room_id: 16
