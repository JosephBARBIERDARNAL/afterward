# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 8
chapter_id: 1
size:
  width_h: 44
  height_h: 28
background_profiles: [city_teal_evening]
hidden_background_layers: [city_teal_evening/3, city_teal_evening/4]
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the ledge the whole room stands on
    color: "#1C1A2E"
    rect_h: { x: 1, y: 0, width: 42, height: 1 }
  - label: east wall
    color: "#1C1A2E"
    rect_h: { x: 43, y: 0, width: 1, height: 28 }
  - label: west wall
    color: "#1C1A2E"
    rect_h: { x: 0, y: 0, width: 1, height: 28 }
  - label: street, the wreck
    color: "#1C1A2E"
    rect_h: { x: 12, y: 1, width: 3, height: 1.5 }
  - label: street, the awning over it
    color: "#1C1A2E"
    rect_h: { x: 18, y: 3.75, width: 4, height: 0.25 }
  - label: east stairs, step 1
    color: "#1C1A2E"
    rect_h: { x: 30, y: 1, width: 4, height: 2 }
  - label: east stairs, step 2
    color: "#1C1A2E"
    rect_h: { x: 34, y: 1, width: 4, height: 4 }
  - label: east stairs, the landing on the east wall
