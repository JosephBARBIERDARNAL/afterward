# Room coordinates use H from the lower-left. Terrain and platform `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a block top.
# Layout: Scattered stones: small stone islands at every height, two high ledges to mantle onto.
room_id: 8
chapter_id: 1
size:
  width_viewports: 3
  height_h: 20
background_profile: chapter_01_autumn_canopy
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid blocks: they stop bodies and projectiles from every side.
terrain:
  - surface: soil # floor
    rect_h: { x: 0, y: 0, width: 48, height: 1 }
  - surface: stone # ceiling
    rect_h: { x: 0, y: 19, width: 48, height: 1 }
  - surface: stone # left wall above the entrance doorway
    rect_h: { x: 0, y: 4, width: 1, height: 15 }
  - surface: stone # right wall above the exit doorway
    rect_h: { x: 47, y: 4, width: 1, height: 15 }
  - surface: stone # island
    rect_h: { x: 6, y: 2, width: 3, height: 1 }
  - surface: stone # island
    rect_h: { x: 10, y: 4, width: 3, height: 1 }
  - surface: stone # island
    rect_h: { x: 14, y: 6, width: 2, height: 1 }
  - surface: stone # island
    rect_h: { x: 18, y: 2, width: 3, height: 1 }
  - surface: stone # island
    rect_h: { x: 22, y: 4, width: 3, height: 1 }
  - surface: stone # island
    rect_h: { x: 26, y: 6, width: 3, height: 1 }
  - surface: stone # island
    rect_h: { x: 31, y: 2, width: 3, height: 1 }
  - surface: stone # island
    rect_h: { x: 35, y: 4, width: 3, height: 1 }
  - surface: stone # island
    rect_h: { x: 39, y: 6, width: 3, height: 1 }
  - surface: stone # high ledge
    rect_h: { x: 16, y: 10, width: 4, height: 1 }
  - surface: stone # high ledge
    rect_h: { x: 30, y: 10, width: 4, height: 1 }
  - surface: stone # hanging rock
    rect_h: { x: 22, y: 13, width: 4, height: 6 }
# One-way platforms: land on top, jump through from below, Down + Jump drops.
platforms: []
decorations: []
enemy_spawns:
  - type_id: gorgon_1
    position_h: { x: 4, y: 1 }
  - type_id: swordsman
    position_h: { x: 7.5, y: 3 }
  - type_id: infantryman
    position_h: { x: 11.5, y: 5 }
  - type_id: gorgon_2
    position_h: { x: 15, y: 7 }
  - type_id: gorgon_1
    position_h: { x: 20, y: 1 }
  - type_id: destroyer
    position_h: { x: 18, y: 11 }
  - type_id: gorgon_3
    position_h: { x: 23.5, y: 5 }
  - type_id: swordsman
    position_h: { x: 27.5, y: 7 }
  - type_id: infantryman
    position_h: { x: 32.5, y: 3 }
  - type_id: gorgon_2
    position_h: { x: 36.5, y: 5 }
  - type_id: destroyer
    position_h: { x: 32, y: 11 }
  - type_id: gorgon_3
    position_h: { x: 40.5, y: 7 }
exit:
  x_h: 45.5
  y_h: 1
next_room_id: 9
