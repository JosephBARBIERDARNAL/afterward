# Devices: traps, moving and folding platforms, buttons, doors and
# ladders, each standing on a spot (the middle of its bottom edge).
devices:
  - kind: terminal
    position_h: { x: 4.25, y: 3 }
    text: "THE GATE. HE NEVER LEFT IT."
    colorway: dusk
  - label: the beam under the west slab
    kind: laser
    position_h: { x: 10.5, y: 1 }
    color: red
    orientation: vertical
    length_h: 2
    off_s: 2.2
    warn_s: 0.5
    on_s: 1
    offset_s: 0
    damage: 10.5
    colorway: dusk
  - label: the beam under the east slab
    kind: laser
    position_h: { x: 21.5, y: 1 }
    color: red
    orientation: vertical
    length_h: 2
    off_s: 2.2
    warn_s: 0.5
    on_s: 1
    offset_s: 1.5
    damage: 10.5
    colorway: dusk
  - kind: light_strip
    position_h: { x: 16, y: 1.25 }
    orientation: horizontal
    length_h: 4
    colorway: dusk
enemy_spawns:
