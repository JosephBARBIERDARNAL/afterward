# Devices: traps, moving and folding platforms, buttons, doors and
# ladders, each standing on a spot (the middle of its bottom edge).
devices:
  - kind: terminal
    position_h: { x: 10, y: 4.5 }
    text: THE GATE. HE NEVER LEFT IT.
    mirrored: true
    colorway: dusk
enemy_spawns:
  - label: the Black Knight
    type_id: black_knight
    position_h: { x: 20.5, y: 4.5 }
    facing: left
