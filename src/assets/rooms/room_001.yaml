# Room coordinates use H from the lower-left. Platform positions are centers;
# player and enemy spawn y_h values mark the feet baseline.
# Layout: Forest edge: open ground with a few low ledges to learn jumping.
room_id: 1
chapter_id: 1
size:
  width_viewports: 2
  height_h: 9
background_profile: chapter_01_forest
player_spawn:
  x_h: 2
  y_h: 0.8
camera:
  follow_player_x: true
  fixed_y_h: 4.5
platforms:
  - position_h: { x: 16, y: 0.3 }
    surface: soil
    size_h: { width: 32, height: 1 }
  - position_h: { x: 7, y: 1.35 }
    surface: stone
    size_h: { width: 3, height: 0.5 }
  - position_h: { x: 12.5, y: 2.15 }
    surface: stone
    size_h: { width: 4, height: 0.5 }
  - position_h: { x: 20, y: 1.45 }
    surface: stone
    size_h: { width: 5, height: 0.5 }
  - position_h: { x: 26.5, y: 2.65 }
    surface: stone
    size_h: { width: 3, height: 0.5 }
decorations: []
enemy_spawns:
  - type_id: swordsman
    position_h: { x: 10, y: 0.8 }
  - type_id: infantryman
    position_h: { x: 12.5, y: 2.4 }
  - type_id: swordsman
    position_h: { x: 17, y: 0.8 }
  - type_id: infantryman
    position_h: { x: 26.5, y: 2.9 }
  - type_id: swordsman
    position_h: { x: 29.5, y: 0.8 }
exit:
  x_h: 30.5
  y_h: 0.8
next_room_id: 2
