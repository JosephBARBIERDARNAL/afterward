# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 1
chapter_id: 1
size:
  width_h: 24
  height_h: 13.5
background_profiles: [city_peach_sunset]
hidden_background_layers: [city_peach_sunset/4, city_peach_sunset/5]
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: floor
    color: "#1C1A2E"
    rect_h: { x: 0, y: 0, width: 24, height: 1 }
  - label: left wall
    color: "#1C1A2E"
    rect_h: { x: 0, y: 1, width: 1, height: 12.5 }
  - label: right wall
    color: "#1C1A2E"
    rect_h: { x: 23, y: 1, width: 1, height: 12.5 }
  - label: left ledge, a jump up from the floor
    color: "#1C1A2E"
    rect_h: { x: 4.5, y: 3, width: 4.5, height: 0.5 }
  - label: right ledge, the shooter's perch
    color: "#1C1A2E"
    rect_h: { x: 18.5, y: 3, width: 4.5, height: 0.5 }
  - label: high walkway, reached from either ledge
    color: "#1C1A2E"
    rect_h: { x: 11.5, y: 5.25, width: 5, height: 0.5 }
  - label: cover from the shots, in the middle of the floor
    color: "#1C1A2E"
    rect_h: { x: 13, y: 1, width: 2, height: 1 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns:
  - label: fodder
    type_id: blade_unit
    position_h: { x: 9.5, y: 1 }
    facing: left
  - label: fodder
