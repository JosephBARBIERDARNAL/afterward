# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 1
chapter_id: 1
description: "The first street: a long ledge under the morning skyline, one raised walkway to climb, and a single ninja between the player and the door."
size:
  width_h: 48
  height_h: 24
background_profile: city_blue_morning
player_spawn:
  x_h: 5
  y_h: 11.5
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the walkway the fight starts on
    material: city_neon_grid
    rect_h: { x: 2, y: 7, width: 9, height: 3 }
  - label: the street the room stands on
    material: city_pavement
    rect_h: { x: -11.75, y: -7.5, width: 71.5, height: 9.5 }
  - label: west wall
    material: city_plating
    rect_h: { x: -11.75, y: 2, width: 13.75, height: 21 }
  - label: roofline
    material: city_plating
    rect_h: { x: -11.5, y: 23, width: 71.5, height: 8.5 }
  - label: east wall
    material: city_plating
    rect_h: { x: 46, y: 2, width: 13.75, height: 21 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns:
  - type_id: dark_ninja
    position_h: { x: 8.5, y: 12.25 }
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 41
  y_h: 2
exit:
  x_h: 43
  y_h: 2
next_room_id: 2
