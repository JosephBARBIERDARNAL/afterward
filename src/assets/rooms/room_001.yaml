# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 1
chapter_id: 1
size:
  width_h: 24
  height_h: 13.5
background_profiles: [sci_fi_industrial]
hidden_background_layers: [sci_fi_industrial/4, sci_fi_industrial/5]
layer_opacity: { sci_fi_industrial/1: 0.8, sci_fi_industrial/2: 0.8 }
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: left wall
    material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0, width: 0.5, height: 13.5 }
  - label: left wall face
    material: sci_fi_trim_wall_right
    rect_h: { x: 0.5, y: 1, width: 0.5, height: 12.5 }
  - label: floor base
    material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0, width: 24, height: 0.5 }
  - label: floor trim
    material: sci_fi_green_edge
    rect_h: { x: 1, y: 0.5, width: 22, height: 0.5 }
  - label: right wall face
    material: sci_fi_trim_wall_left
    rect_h: { x: 23, y: 1, width: 0.5, height: 12.5 }
  - label: right wall
    material: sci_fi_dark_rivets
    rect_h: { x: 23.5, y: 0, width: 0.5, height: 13.5 }
  - label: left ledge trim, a jump up from the floor
    material: sci_fi_green_edge
    rect_h: { x: 5, y: 3, width: 3.5, height: 0.5 }
  - label: left ledge underside
    material: sci_fi_trim_ceiling
    rect_h: { x: 5, y: 2.5, width: 3.5, height: 0.5 }
  - label: right ledge trim, the shooter's perch
    material: sci_fi_green_edge
    rect_h: { x: 19, y: 3, width: 4, height: 0.5 }
  - label: right ledge underside
    material: sci_fi_trim_ceiling
    rect_h: { x: 19, y: 2.5, width: 4, height: 0.5 }
  - label: high walkway trim, reached from either ledge
    material: sci_fi_green_edge
    rect_h: { x: 12, y: 5, width: 4, height: 0.5 }
  - label: high walkway underside
    material: sci_fi_trim_ceiling
    rect_h: { x: 12, y: 4.5, width: 4, height: 0.5 }
  - label: cover face left
    material: sci_fi_trim_wall_left
    rect_h: { x: 13, y: 1, width: 0.5, height: 0.5 }
  - label: cover base, in the middle of the floor
    material: sci_fi_dark_rivets
    rect_h: { x: 13.5, y: 1, width: 1, height: 0.5 }
  - label: cover trim
    material: sci_fi_green_edge
    rect_h: { x: 13.5, y: 1.5, width: 1, height: 0.5 }
  - label: cover face right
    material: sci_fi_trim_wall_right
    rect_h: { x: 14.5, y: 1, width: 0.5, height: 0.5 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
# Props: sprites standing on a spot (the middle of their bottom edge).
props:
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 0.75, y: 0.5 }
  - label: joint
    prop: sci_fi_steel_block
