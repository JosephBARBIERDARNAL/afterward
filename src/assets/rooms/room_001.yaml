# Room coordinates use H from the lower-left. Terrain and platform `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a block top.
room_id: 1
chapter_id: 1
description: "Crypt entrance: a low hall with a step and a raised gallery reached by planks."
size:
  width_viewports: 2
  height_h: 14
background_profile: city_night_stars
player_spawn:
  x_h: 2.75
  y_h: 1
# Solid blocks: they stop bodies and projectiles from every side.
terrain:
  - label: floor
    material: grassy_dark_cobble
    rect_h: { x: 0, y: 0, width: 32, height: 1 }
  - material: stone_dark_cobble
    rect_h: { x: -0, y: 8, width: 32, height: 6 }
  - label: left wall above the entrance doorway
    material: stone_dark_cobble
    rect_h: { x: 0, y: 4, width: 1, height: 4 }
  - label: right wall above the exit doorway
    material: stone_dark_cobble
    rect_h: { x: 31, y: 1, width: 1, height: 12 }
  - label: step
    material: stone_bricks
    rect_h: { x: 10, y: 1, width: 2, height: 1.5 }
  - label: gallery
    material: mossy_bricks
    rect_h: { x: 22, y: 6, width: 8, height: 1 }
  - material: wood_crate
    rect_h: { x: 11.5, y: 5.75, width: 0.25, height: 0.25 }
# One-way platforms: land on top, jump through from below, Down + Jump drops.
platforms:
  - material: wood_planks
    rect_h: { x: 14, y: 2.75, width: 4, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 18.5, y: 4.75, width: 3, height: 0.25 }
# Decorations: non-solid panels behind the terrain or in front of the bodies.
decorations:
  - label: crypt column
    material: carved_pillar
    layer: background
    rect_h: { x: 21, y: 1, width: 1, height: 5 }
  - label: crypt back wall
    material: carved_ashlar
    layer: background
    rect_h: { x: 22, y: 1, width: 8, height: 5 }
  - label: crypt column
    material: carved_pillar
    layer: background
    rect_h: { x: 30, y: 1, width: 1, height: 5 }
enemy_spawns:
  - type_id: swordsman
    position_h: { x: 6, y: 1 }
  - type_id: infantryman
    position_h: { x: 16, y: 3 }
  - type_id: swordsman
    position_h: { x: 20, y: 1 }
  - type_id: infantryman
    position_h: { x: 27, y: 7 }
  - type_id: swordsman
    position_h: { x: 28, y: 1 }
  - type_id: destroyer
    position_h: { x: 22.5, y: 1 }
  - type_id: destroyer
    position_h: { x: 10.5, y: 2.5 }
exit:
  x_h: 30.5
  y_h: 1
next_room_id: 2
