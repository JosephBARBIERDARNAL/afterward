# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 13
chapter_id: 2
size:
  width_h: 48
  height_h: 18
background_profiles: [dead_city_ephemeral]
hidden_background_layers: [dead_city_ephemeral/4, dead_city_ephemeral/5]
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the ledge the whole room stands on
    color: "#1C1A2E"
    rect_h: { x: 1, y: 0, width: 46, height: 1 }
  - label: east wall
    color: "#1C1A2E"
    rect_h: { x: 47, y: 0, width: 1, height: 18 }
  - label: west wall
    color: "#1C1A2E"
    rect_h: { x: 0, y: 0, width: 1, height: 18 }
  - label: the awning over the west mouth of the tunnel
    color: "#1C1A2E"
    rect_h: { x: 5, y: 2.75, width: 3, height: 0.25 }
  - label: ziggurat, first tier, roofing the tunnel
    color: "#1C1A2E"
    rect_h: { x: 8, y: 3.5, width: 32, height: 1.5 }
  - label: ziggurat, second tier
    color: "#1C1A2E"
    rect_h: { x: 12, y: 5, width: 24, height: 2 }
  - label: ziggurat, third tier
    color: "#1C1A2E"
    rect_h: { x: 16, y: 7, width: 16, height: 2 }
  - label: ziggurat, the summit
    color: "#1C1A2E"
    rect_h: { x: 20, y: 9, width: 8, height: 2 }
  - label: the canopy over the summit
    color: "#1C1A2E"
    rect_h: { x: 22.5, y: 12.75, width: 3, height: 0.25 }
  - label: the awning over the east mouth of the tunnel
    color: "#1C1A2E"
    rect_h: { x: 40, y: 2.75, width: 3, height: 0.25 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
