# Room coordinates use H from the lower-left. Terrain and platform `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a block top.
room_id: 10
chapter_id: 1
description: "Boss arena: an enclosed hall with wall ledges, low planks, and hanging pillars."
size:
  width_viewports: 3
  height_h: 14
background_profile: chapter_01_autumn_sunbeams
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid blocks: they stop bodies and projectiles from every side.
terrain:
  - label: floor
    surface: soil
    rect_h: { x: 0, y: 0, width: 48, height: 1 }
  - label: ceiling
    surface: stone
    rect_h: { x: 0, y: 13, width: 48, height: 1 }
  - label: left wall above the entrance doorway
    surface: stone
    rect_h: { x: 0, y: 4, width: 1, height: 9 }
  - label: right wall above the exit doorway
    surface: stone
    rect_h: { x: 47, y: 4, width: 1, height: 9 }
  - label: west ledge
    surface: stone
    rect_h: { x: 1, y: 5, width: 6, height: 1 }
  - label: east ledge
    surface: stone
    rect_h: { x: 41, y: 5, width: 6, height: 1 }
  - label: hanging pillar
    surface: stone
    rect_h: { x: 14, y: 9, width: 2, height: 4 }
  - label: hanging pillar
    surface: stone
    rect_h: { x: 32, y: 9, width: 2, height: 4 }
# One-way platforms: land on top, jump through from below, Down + Jump drops.
platforms:
  - surface: wood
    rect_h: { x: 10, y: 2.75, width: 4, height: 0.25 }
  - surface: wood
    rect_h: { x: 34, y: 2.75, width: 4, height: 0.25 }
  - surface: wood
    rect_h: { x: 20, y: 4.75, width: 8, height: 0.25 }
decorations: []
enemy_spawns:
  - type_id: evil_wizard
    position_h: { x: 18, y: 1 }
exit:
  x_h: 45.5
  y_h: 1
next_room_id: 11
