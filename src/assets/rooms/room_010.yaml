# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 10
chapter_id: 1
size:
  width_h: 24
  height_h: 13.5
background_profiles: [sci_fi_industrial]
hidden_background_layers: [sci_fi_industrial/4, sci_fi_industrial/5]
layer_opacity: { sci_fi_industrial/1: 0.8, sci_fi_industrial/2: 0.8 }
player_spawn:
  x_h: 4.25
  y_h: 1
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0, width: 24, height: 0.5 }
  - material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0.5, width: 0.5, height: 13 }
  - material: sci_fi_green_edge
    rect_h: { x: 1, y: 0.5, width: 22, height: 0.5 }
  - material: sci_fi_dark_rivets
    rect_h: { x: 23.5, y: 0.5, width: 0.5, height: 13 }
  - material: sci_fi_trim_wall_right
    rect_h: { x: 0.5, y: 1, width: 0.5, height: 2 }
  - material: sci_fi_trim_wall_left
    rect_h: { x: 23, y: 1, width: 0.5, height: 2 }
  - material: sci_fi_green_edge
    rect_h: { x: 1, y: 3, width: 3, height: 0.5 }
  - material: sci_fi_green_edge
    rect_h: { x: 15.5, y: 3, width: 7.5, height: 0.5 }
  - material: sci_fi_trim_wall_right
    rect_h: { x: 0.5, y: 3.5, width: 0.5, height: 10 }
  - material: sci_fi_trim_wall_left
    rect_h: { x: 23, y: 3.5, width: 0.5, height: 10 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
# Props: sprites standing on a spot (the middle of their bottom edge).
props:
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 0.75, y: 0.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 0.75, y: 3 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 4.25, y: 3 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 15.25, y: 3 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 23.25, y: 0.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 23.25, y: 3 }
  - prop: sci_fi_barrel
    position_h: { x: 9, y: 1 }
    solid: false
    opacity: 0.8
  - prop: sci_fi_small_crate
    position_h: { x: 21.5, y: 3.5 }
    solid: false
    mirrored: true
    opacity: 0.8
  - prop: sci_fi_pipe_vertical
    position_h: { x: 0.5, y: 6 }
  - prop: sci_fi_pipe_vertical
    position_h: { x: 23.5, y: 6 }
# Devices: traps, moving and folding platforms, buttons, doors and
# ladders, each standing on a spot (the middle of its bottom edge).
devices:
  - kind: terminal
    position_h: { x: 1.75, y: 3.5 }
    text: BLUEPRINT 10. SEALED. WHAT GUARDS THIS DOOR WAS NEVER DRAWN ON THE PLANS.
  - kind: laser
    position_h: { x: 3, y: 1 }
    color: red
    orientation: vertical
    length_h: 2
    off_s: 1.2
    warn_s: 0.5
    on_s: 1
    offset_s: 0
    damage: 15
  - kind: laser
    position_h: { x: 19, y: 1 }
    color: red
    orientation: vertical
    length_h: 2
    off_s: 1.2
    warn_s: 0.5
    on_s: 1
    offset_s: 1.1
    damage: 15
  - kind: blade
    position_h: { x: 7, y: 1 }
    travel_x_h: 4
    travel_y_h: 0
    speed_h_s: 2
    damage: 15
  - kind: light_strip
    position_h: { x: 9, y: 1.25 }
    orientation: horizontal
    length_h: 4.5
enemy_spawns:
  - type_id: dark_blade_unit
    position_h: { x: 4, y: 3.5 }
    facing: right
    armor_layers: 3
  - type_id: dark_blade_unit
    position_h: { x: 15.25, y: 3.5 }
    facing: left
    armor_layers: 3
  - type_id: dark_blade_unit
    position_h: { x: 13.5, y: 1 }
    facing: left
    armor_layers: 3
  - type_id: dark_heavy_unit
    position_h: { x: 11, y: 1 }
    facing: left
    armor_layers: 3
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 20.75
  y_h: 1
exit:
  x_h: 22
  y_h: 1
next_room_id: 11
