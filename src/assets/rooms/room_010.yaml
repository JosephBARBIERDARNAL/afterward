# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 10
chapter_id: 1
size:
  width_h: 24
  height_h: 13.5
background_profile: city_teal_evening
player_spawn:
  x_h: 4.25
  y_h: 1
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the ledge the whole room stands on
    color: "#1C1A2E"
    rect_h: { x: 1, y: 0, width: 23, height: 1 }
  - label: the ledge the whole room stands on
    color: "#1C1A2E"
    rect_h: { x: 23, y: 0, width: 1, height: 13.5 }
  - label: the ledge the whole room stands on
    color: "#1C1A2E"
    rect_h: { x: 0, y: 0, width: 1, height: 13.5 }
  - color: "#1C1A2E"
    rect_h: { x: 14.75, y: 3.75, width: 8.25, height: 0.25 }
  - color: "#1C1A2E"
    rect_h: { x: 1, y: 3, width: 2, height: 0.25 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns:
  - type_id: dark_blade_unit
    position_h: { x: 2.5, y: 3.25 }
    facing: right
    stat_overrides: { health: 120, armor_layers: 3 }
  - type_id: emitter_unit
    position_h: { x: 15.75, y: 1 }
    facing: left
    stat_overrides: { health: 500, armor_layers: 5 }
  - type_id: dark_blade_unit
    position_h: { x: 15, y: 4 }
    facing: left
    stat_overrides: { health: 120, armor_layers: 3 }
  - type_id: dark_blade_unit
    position_h: { x: 17.25, y: 1 }
    facing: left
    stat_overrides: { health: 120, armor_layers: 3 }
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 20.75
  y_h: 1
exit:
  x_h: 22
  y_h: 1
next_room_id: 11
