# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 0
chapter_id: 1
size:
  width_h: 62
  height_h: 16
background_profiles: [sci_fi_industrial]
hidden_background_layers: [sci_fi_industrial/4, sci_fi_industrial/5]
layer_opacity: { sci_fi_industrial/1: 0.8, sci_fi_industrial/2: 0.8 }
player_spawn:
  x_h: 4.25
  y_h: 2
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: left wall
    material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0, width: 0.5, height: 16 }
  - label: left wall face
    material: sci_fi_trim_wall_right
    rect_h: { x: 0.5, y: 2, width: 0.5, height: 14 }
  - label: first floor base
    material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0, width: 20.5, height: 1.5 }
  - label: first floor trim
    material: sci_fi_green_edge
    rect_h: { x: 1, y: 1.5, width: 19.5, height: 0.5 }
  - label: first floor face
    material: sci_fi_trim_wall_right
    rect_h: { x: 20.5, y: 0, width: 0.5, height: 1.5 }
  - label: second floor face left
    material: sci_fi_trim_wall_left
    rect_h: { x: 24, y: 0, width: 0.5, height: 1.5 }
  - label: second floor base
    material: sci_fi_dark_rivets
    rect_h: { x: 24.5, y: 0, width: 10, height: 1.5 }
  - label: second floor trim
    material: sci_fi_green_edge
    rect_h: { x: 24.5, y: 1.5, width: 10, height: 0.5 }
  - label: second floor face right
    material: sci_fi_trim_wall_right
    rect_h: { x: 34.5, y: 0, width: 0.5, height: 1.5 }
  - label: pillar face left
    material: sci_fi_trim_wall_left
    rect_h: { x: 44.5, y: 0, width: 0.5, height: 2 }
  - label: pillar base
    material: sci_fi_dark_rivets
    rect_h: { x: 45, y: 0, width: 4.5, height: 2 }
  - label: pillar trim
    material: sci_fi_green_edge
    rect_h: { x: 45, y: 2, width: 4.5, height: 0.5 }
  - label: pillar face right
    material: sci_fi_trim_wall_right
    rect_h: { x: 49.5, y: 0, width: 0.5, height: 2 }
  - label: exit ledge trim
    material: sci_fi_green_edge
    rect_h: { x: 58, y: 9, width: 3, height: 0.5 }
  - label: exit ledge underside
    material: sci_fi_trim_ceiling
    rect_h: { x: 58, y: 8.5, width: 3, height: 0.5 }
  - label: right wall face
    material: sci_fi_trim_wall_left
    rect_h: { x: 61, y: 0, width: 0.5, height: 16 }
  - label: right wall
    material: sci_fi_dark_rivets
    rect_h: { x: 61.5, y: 0, width: 0.5, height: 16 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
# Props: sprites standing on a spot (the middle of their bottom edge).
props:
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 0.75, y: 1.5 }
  - label: joint
    prop: sci_fi_steel_block
    position_h: { x: 7.25, y: 1.5 }
  - label: joint
    prop: sci_fi_steel_block
    position_h: { x: 14.25, y: 1.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 20.75, y: 1.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 24.25, y: 1.5 }
  - label: joint
    prop: sci_fi_steel_block
    position_h: { x: 29.75, y: 1.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 34.75, y: 1.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 44.75, y: 2 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 49.75, y: 2 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 57.75, y: 9 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 57.75, y: 8.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 61.25, y: 9 }
  - prop: sci_fi_crate_stack
    position_h: { x: 26, y: 2 }
    solid: false
    opacity: 0.8
  - prop: sci_fi_small_crate
    position_h: { x: 19.5, y: 2 }
    solid: false
    opacity: 0.8
  - prop: sci_fi_barrel
    position_h: { x: 20.25, y: 2 }
    solid: false
    opacity: 0.8
