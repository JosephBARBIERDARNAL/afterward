# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 0
chapter_id: 1
size:
  width_h: 55
  height_h: 16
background_profiles: [sci_fi_industrial]
hidden_background_layers: [sci_fi_industrial/1, sci_fi_industrial/4, sci_fi_industrial/5]
player_spawn:
  x_h: 4.25
  y_h: 2
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - material: sci_fi_riveted_wall
    rect_h: { x: 0.5, y: 1, width: 20, height: 0.5 }
  - material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0.5, width: 20.5, height: 0.5 }
  - material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0, width: 20.5, height: 0.5 }
  - material: sci_fi_riveted_wall
    rect_h: { x: 0.5, y: 1.5, width: 0.5, height: 14.5 }
  - material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 1, width: 0.5, height: 15 }
  - material: sci_fi_riveted_wall
    rect_h: { x: 20.5, y: 0, width: 0.5, height: 1.5 }
  - material: sci_fi_green_edge
    rect_h: { x: 1, y: 1.5, width: 20, height: 0.5 }
  - material: sci_fi_riveted_wall
    rect_h: { x: 24.5, y: 1, width: 10, height: 0.5 }
  - material: sci_fi_dark_rivets
    rect_h: { x: 24.5, y: 0, width: 10, height: 1 }
  - material: sci_fi_riveted_wall
    rect_h: { x: 34.5, y: 0, width: 0.5, height: 1.5 }
  - material: sci_fi_green_edge
    rect_h: { x: 24, y: 1.5, width: 11, height: 0.5 }
  - material: sci_fi_riveted_wall
    rect_h: { x: 24, y: 0, width: 0.5, height: 1.5 }
  - material: sci_fi_riveted_wall
    rect_h: { x: 39.25, y: 1.5, width: 3.5, height: 0.5 }
  - material: sci_fi_dark_rivets
    rect_h: { x: 39.25, y: 0, width: 3.5, height: 1.5 }
  - material: sci_fi_riveted_wall
    rect_h: { x: 42.75, y: 0, width: 0.5, height: 2 }
  - material: sci_fi_green_edge
    rect_h: { x: 38.75, y: 2, width: 4.5, height: 0.5 }
  - material: sci_fi_riveted_wall
    rect_h: { x: 38.75, y: 0, width: 0.5, height: 2 }
  - material: sci_fi_riveted_wall
    rect_h: { x: 54, y: 0, width: 0.5, height: 16 }
  - material: sci_fi_dark_rivets
    rect_h: { x: 54.5, y: 0, width: 0.5, height: 16 }
  - material: sci_fi_green_edge
    rect_h: { x: 51, y: 9, width: 3, height: 0.5 }
  - material: sci_fi_riveted_wall
    rect_h: { x: 51, y: 8.75, width: 3, height: 0.25 }
  - material: sci_fi_trim_ceiling
    rect_h: { x: 51, y: 8.5, width: 3, height: 0.25 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
# Props: sprites standing on a spot (the middle of their bottom edge).
props:
  - prop: sci_fi_bench
    position_h: { x: 37.5, y: 3.25 }
  - prop: sci_fi_bench
    position_h: { x: 42, y: 7.5 }
  - prop: sci_fi_bench
    position_h: { x: 45.5, y: 8.5 }
  - prop: sci_fi_bench
    position_h: { x: 48.75, y: 9 }
# Devices: traps, moving and folding platforms, buttons, doors and
# ladders, each standing on a spot (the middle of its bottom edge).
devices:
  - kind: hover_platform
    position_h: { x: 46.25, y: 2 }
    size: large
    travel_x_h: -9
    travel_y_h: 5
    speed_h_s: 2
enemy_spawns: []
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 51.75
  y_h: 9.5
exit:
  x_h: 53.5
  y_h: 9.5
next_room_id: 1
