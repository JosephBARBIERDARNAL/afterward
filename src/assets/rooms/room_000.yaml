    position_h: { x: 32.75, y: 2 }
    solid: false
    mirrored: true
    opacity: 0.8
  - prop: sci_fi_pipe_vertical
    position_h: { x: 61.5, y: 11 }
  - prop: sci_fi_bench
    position_h: { x: 49, y: 5 }
  - prop: sci_fi_bench
    position_h: { x: 51.75, y: 7.5 }
  - prop: sci_fi_bench
    position_h: { x: 55.75, y: 9 }
  - prop: sci_fi_barrel
    position_h: { x: 48.5, y: 2.5 }
    opacity: 0.8
  - prop: sci_fi_framed_fan
    position_h: { x: 9, y: 0.25 }
    opacity: 0.90000004
  - prop: sci_fi_framed_fan
    position_h: { x: 31.25, y: 0.25 }
    opacity: 0.90000004
  - prop: sci_fi_pipe_vertical
    position_h: { x: 0.5, y: 11.25 }
  - prop: sci_fi_pipe_vertical
    position_h: { x: 61.5, y: 1.75 }
# Devices: traps, moving and folding platforms, buttons, doors and
# ladders, each standing on a spot (the middle of its bottom edge).
devices:
  - label: welcome terminal
    kind: terminal
    position_h: { x: 1.75, y: 2 }
    text: "CITY ACCESS LOG. LAST ENTRY: 41 YEARS AGO."
enemy_spawns: []
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 58.5
  y_h: 9.5
exit:
  x_h: 60
  y_h: 9.5
next_room_id: 1
