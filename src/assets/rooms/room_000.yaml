# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 0
chapter_id: 1
description: "The Threshold: the run's first steps. One viewport of bare ledge under an open sky, no enemies and nothing to fight for, with the door already standing open at the right."
size:
  width_h: 48
  height_h: 14
background_profile: city_pink_dusk
player_spawn:
  x_h: 9.75
  y_h: 2
# One-way platforms: land on top, pass through from every other side,
# Down + Jump drops through. They stop shots.
platforms:
  - label: the ledge the whole room stands on
    material: city_pavement
    rect_h: { x: 0, y: 0, width: 48, height: 2 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns: []
exit:
  x_h: 46.75
  y_h: 2
next_room_id: 1
