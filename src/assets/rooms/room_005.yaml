# Room coordinates use H from the lower-left. Terrain and platform `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a block top.
room_id: 5
chapter_id: 1
description: "Twin mounds: two stepped stone mounds facing each other across a hall, rock overhead."
size:
  width_viewports: 3
  height_h: 16
background_profile: chapter_01_hills
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid blocks: they stop bodies and projectiles from every side.
terrain:
  - label: floor
    surface: soil
    rect_h: { x: 0, y: 0, width: 48, height: 1 }
  - label: ceiling
    surface: stone
    rect_h: { x: 0, y: 15, width: 48, height: 1 }
  - label: left wall above the entrance doorway
    surface: stone
    rect_h: { x: 0, y: 4, width: 1, height: 11 }
  - label: right wall above the exit doorway
    surface: stone
    rect_h: { x: 47, y: 4, width: 1, height: 11 }
  - label: west mound base
    surface: stone
    rect_h: { x: 9, y: 1, width: 8, height: 2 }
  - label: west mound middle
    surface: stone
    rect_h: { x: 10.5, y: 3, width: 5, height: 2 }
  - label: west mound top
    surface: stone
    rect_h: { x: 12, y: 5, width: 2, height: 2 }
  - label: east mound base
    surface: stone
    rect_h: { x: 31, y: 1, width: 10, height: 2 }
  - label: east mound middle
    surface: stone
    rect_h: { x: 33, y: 3, width: 6, height: 2 }
  - label: east mound top
    surface: stone
    rect_h: { x: 35, y: 5, width: 2, height: 2 }
  - label: hanging rock
    surface: stone
    rect_h: { x: 20, y: 11, width: 8, height: 4 }
# One-way platforms: land on top, jump through from below, Down + Jump drops.
platforms:
  - surface: wood
    rect_h: { x: 22.5, y: 2.75, width: 3, height: 0.25 }
decorations: []
enemy_spawns:
  - type_id: swordsman
    position_h: { x: 6, y: 1 }
  - type_id: gorgon_1
    position_h: { x: 10, y: 3 }
  - type_id: infantryman
    position_h: { x: 13, y: 7 }
  - type_id: gorgon_2
    position_h: { x: 15, y: 5 }
  - type_id: gorgon_1
    position_h: { x: 21, y: 1 }
  - type_id: swordsman
    position_h: { x: 24, y: 3 }
  - type_id: destroyer
    position_h: { x: 36, y: 7 }
  - type_id: gorgon_2
    position_h: { x: 38, y: 5 }
  - type_id: infantryman
    position_h: { x: 40, y: 3 }
exit:
  x_h: 45.5
  y_h: 1
next_room_id: 6
