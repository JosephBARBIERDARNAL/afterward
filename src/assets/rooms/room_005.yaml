# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 5
chapter_id: 1
size:
  width_h: 33
  height_h: 16
background_profiles: [sci_fi_industrial]
hidden_background_layers: [sci_fi_industrial/4, sci_fi_industrial/5]
layer_opacity: { sci_fi_industrial/1: 0.8, sci_fi_industrial/2: 0.8 }
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the ledge the whole room stands on, trim
    material: sci_fi_green_edge
    rect_h: { x: 1, y: 0.5, width: 8, height: 0.5 }
  - label: the ledge the whole room stands on, trim
    material: sci_fi_green_edge
    rect_h: { x: 9.5, y: 0.5, width: 7, height: 0.5 }
  - label: the ledge the whole room stands on, trim
    material: sci_fi_green_edge
    rect_h: { x: 17, y: 0.5, width: 7, height: 0.5 }
  - label: the ledge the whole room stands on, trim
    material: sci_fi_green_edge
    rect_h: { x: 24.5, y: 0.5, width: 7.5, height: 0.5 }
  - label: the ledge the whole room stands on, base
    material: sci_fi_dark_rivets
    rect_h: { x: 32.5, y: 0.5, width: 0.5, height: 0.5 }
  - label: the ledge the whole room stands on, base
    material: sci_fi_dark_rivets
    rect_h: { x: 1, y: 0, width: 32, height: 0.5 }
  - label: the ledge the whole room stands on, face left
    material: sci_fi_trim_wall_left
    rect_h: { x: 32, y: 1, width: 0.5, height: 15 }
  - label: the ledge the whole room stands on, base
    material: sci_fi_dark_rivets
    rect_h: { x: 32.5, y: 1, width: 0.5, height: 15 }
  - label: the ledge the whole room stands on, base
    material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0.5, width: 0.5, height: 15.5 }
  - label: the ledge the whole room stands on, face right
    material: sci_fi_trim_wall_right
    rect_h: { x: 0.5, y: 1, width: 0.5, height: 15 }
  - label: the ledge the whole room stands on, base
    material: sci_fi_dark_rivets
    rect_h: { x: 0, y: 0, width: 1, height: 0.5 }
  - label: trim
    material: sci_fi_green_edge
    rect_h: { x: 16.5, y: 3, width: 7.5, height: 0.5 }
  - label: trim
    material: sci_fi_green_edge
    rect_h: { x: 10.75, y: 5, width: 3.5, height: 0.5 }
  - label: way up, step 3, trim
    material: sci_fi_green_edge
    rect_h: { x: 29.75, y: 3, width: 2.25, height: 0.5 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
# Props: sprites standing on a spot (the middle of their bottom edge).
props:
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 0.75, y: 0.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 9.25, y: 0.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 16.75, y: 0.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 24.25, y: 0.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 32.25, y: 0.5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 16.25, y: 3 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 24.25, y: 3 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 10.5, y: 5 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 14.5, y: 5 }
  - prop: sci_fi_crate_stack
    position_h: { x: 6, y: 1 }
    solid: false
    mirrored: true
    opacity: 0.8
  - prop: sci_fi_barrel
    position_h: { x: 22.75, y: 3.5 }
    solid: false
    opacity: 0.8
  - prop: sci_fi_small_crate
    position_h: { x: 11.25, y: 5.5 }
    solid: false
    mirrored: true
    opacity: 0.8
  - prop: sci_fi_pipe_vertical
    position_h: { x: 0.5, y: 3 }
  - prop: sci_fi_pipe_vertical
    position_h: { x: 32.5, y: 8 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 29.5, y: 3 }
  - label: corner
    prop: sci_fi_steel_block
    position_h: { x: 32.25, y: 3 }
# Devices: traps, moving and folding platforms, buttons, doors and
# ladders, each standing on a spot (the middle of its bottom edge).
devices:
  - kind: terminal
    position_h: { x: 31.5, y: 3.5 }
    text: "CITY ACCESS LOG. ROOM IS NOW CLEARED."
    mirrored: true
enemy_spawns:
  - type_id: heavy_unit
    position_h: { x: 17.5, y: 3.5 }
    facing: left
    armor_layers: 3
  - type_id: dark_blade_unit
    position_h: { x: 14.5, y: 1 }
    facing: left
    armor_layers: 3
  - type_id: dark_blade_unit
    position_h: { x: 12.8, y: 5.5 }
    facing: right
    armor_layers: 3
  - type_id: dark_blade_unit
    position_h: { x: 16.5, y: 1 }
    facing: left
    armor_layers: 3
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 29.5
  y_h: 1
exit:
  x_h: 31
  y_h: 1
next_room_id: 6
