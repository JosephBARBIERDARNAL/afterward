# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 5
chapter_id: 1
size:
  width_h: 33
  height_h: 16
background_profile: city_peach_sunset
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the ledge the whole room stands on
    color: "#1C1A2E"
    rect_h: { x: 1, y: 0, width: 32, height: 1 }
  - label: the ledge the whole room stands on
    color: "#1C1A2E"
    rect_h: { x: 32, y: 0, width: 1, height: 16 }
  - label: the ledge the whole room stands on
    color: "#1C1A2E"
    rect_h: { x: 0, y: 0, width: 1, height: 16 }
  - color: "#1C1A2E"
    rect_h: { x: 16, y: 3.75, width: 8.25, height: 0.25 }
  - color: "#1C1A2E"
    rect_h: { x: 11, y: 6, width: 4.25, height: 0.25 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns:
  - type_id: heavy_unit
    position_h: { x: 17.5, y: 4 }
    facing: left
    stat_overrides: { health: 120, armor_layers: 3 }
  - type_id: dark_blade_unit
    position_h: { x: 14.5, y: 1 }
    facing: left
    stat_overrides: { health: 500, armor_layers: 3 }
  - type_id: dark_blade_unit
    position_h: { x: 13.55, y: 6.25 }
    facing: right
    stat_overrides: { health: 500, armor_layers: 3 }
  - type_id: dark_blade_unit
    position_h: { x: 16.5, y: 1 }
    facing: left
    stat_overrides: { health: 500, armor_layers: 3 }
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 29.5
  y_h: 1
exit:
  x_h: 31
  y_h: 1
next_room_id: 6
