# Devices: traps, moving and folding platforms, buttons, doors and
# ladders, each standing on a spot (the middle of its bottom edge).
devices:
  - kind: terminal
    position_h: { x: 4, y: 3 }
    text: "VAULT 9. THE GOLD WALKS."
    mirrored: true
    colorway: dusk
  - label: the blade under the west slab
    kind: blade
    position_h: { x: 8, y: 1 }
    travel_x_h: 5
    travel_y_h: 0
    speed_h_s: 2
    damage: 15
    colorway: dusk
  - label: the blade under the east slab
    kind: blade
    position_h: { x: 26, y: 1 }
    travel_x_h: -5
    travel_y_h: 0
    speed_h_s: 2
    damage: 15
    colorway: dusk
  - kind: light_strip
    position_h: { x: 17, y: 1.25 }
    orientation: horizontal
    length_h: 6
    colorway: dusk
enemy_spawns:
  - type_id: abomination_gold
    position_h: { x: 17, y: 1 }
    facing: left
    armor_layers: 1
