# Room coordinates use H from the lower-left. Terrain and platform `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a block top.
room_id: 3
chapter_id: 1
description: "Canopy walkway: a broken high walkway over a long hall, a sniper perch above it."
size:
  width_viewports: 3
  height_h: 18
background_profile: clouds_bright_blue
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid blocks: they stop bodies and projectiles from every side.
terrain:
  - label: floor
    material: grassy_cobble
    rect_h: { x: 0, y: 0, width: 48, height: 1 }
  - label: ceiling
    material: moss_thicket
    rect_h: { x: 0, y: 17, width: 48, height: 1 }
  - label: left wall above the entrance doorway
    material: stone_cobble
    rect_h: { x: 0, y: 4, width: 1, height: 13 }
  - label: right wall above the exit doorway
    material: stone_cobble
    rect_h: { x: 47, y: 1, width: 1, height: 16 }
  - label: walkway west
    material: mossy_slab
    rect_h: { x: 13, y: 6, width: 14, height: 1 }
  - label: walkway east
    material: mossy_slab
    rect_h: { x: 30, y: 6, width: 10, height: 1 }
  - label: step
    material: stone_bricks
    rect_h: { x: 28, y: 1, width: 2, height: 1.5 }
  - label: hanging rock
    material: moss_boulders
    rect_h: { x: 20, y: 12, width: 6, height: 5 }
# One-way platforms: land on top, jump through from below, Down + Jump drops.
platforms:
  - material: stone_slab
    rect_h: { x: 6, y: 2.75, width: 3, height: 0.25 }
  - material: stone_slab
    rect_h: { x: 10, y: 4.75, width: 3, height: 0.25 }
  - material: stone_slab
    rect_h: { x: 33, y: 8.75, width: 3, height: 0.25 }
  - material: stone_slab
    rect_h: { x: 37, y: 10.75, width: 3, height: 0.25 }
  - material: stone_slab
    rect_h: { x: 41, y: 4.75, width: 3, height: 0.25 }
  - material: stone_slab
    rect_h: { x: 44, y: 2.75, width: 2, height: 0.25 }
# Decorations: non-solid panels behind the terrain or in front of the bodies.
decorations: []
enemy_spawns:
  - type_id: gorgon_1
    position_h: { x: 8, y: 1 }
  - type_id: infantryman
    position_h: { x: 20, y: 7 }
  - type_id: gorgon_1
    position_h: { x: 24, y: 1 }
  - type_id: swordsman
    position_h: { x: 35, y: 7 }
  - type_id: infantryman
    position_h: { x: 38.5, y: 11 }
  - type_id: gorgon_1
    position_h: { x: 43, y: 1 }
  - type_id: dark_ninja
    position_h: { x: 29, y: 2.5 }
exit:
  x_h: 45.5
  y_h: 1
next_room_id: 4
