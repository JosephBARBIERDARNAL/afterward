# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 9
chapter_id: 1
size:
  width_h: 62
  height_h: 16
background_profiles: [city_teal_evening]
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the ledge the whole room stands on
    color: "#1C1A2E"
    rect_h: { x: 1, y: 0, width: 60, height: 1 }
  - label: east wall
    color: "#1C1A2E"
    rect_h: { x: 61, y: 0, width: 1, height: 16 }
  - label: west wall
    color: "#1C1A2E"
    rect_h: { x: 0, y: 0, width: 1, height: 16 }
  - label: street, the barricade
    color: "#1C1A2E"
    rect_h: { x: 10, y: 1, width: 2, height: 1.5 }
  - label: street, the catwalk under the west roof
    color: "#1C1A2E"
    rect_h: { x: 15, y: 3.25, width: 6, height: 0.25 }
  - label: street, the block under the ramp
    color: "#1C1A2E"
    rect_h: { x: 27, y: 1, width: 4, height: 2 }
  - label: street, the low wall before the stairs
    color: "#1C1A2E"
    rect_h: { x: 38, y: 1, width: 3, height: 1.5 }
  - label: east stairs, step 1
    color: "#1C1A2E"
    rect_h: { x: 50, y: 1, width: 4, height: 2 }
  - label: east stairs, step 2
    color: "#1C1A2E"
    rect_h: { x: 54, y: 1, width: 4, height: 4 }
  - label: east stairs, the landing on the east wall
    color: "#1C1A2E"
    rect_h: { x: 58, y: 1, width: 3, height: 6 }
  - label: the step back west, up to the roofs
    color: "#1C1A2E"
    rect_h: { x: 53.5, y: 8.75, width: 2.5, height: 0.25 }
  - label: the east roof
    color: "#1C1A2E"
    rect_h: { x: 42.92, y: 8.99, width: 7.5, height: 2 }
  - label: the middle roof
    color: "#1C1A2E"
    rect_h: { x: 30.92, y: 9.99, width: 9.5, height: 2 }
  - label: the ramp down from the middle roof to the west roof
    color: "#1C1A2E"
    rect_h: { x: 25.25, y: 10.75, width: 5.85, height: 0.25 }
    rotation_deg: 20
  - label: the west roof
    color: "#1C1A2E"
    rect_h: { x: 9.92, y: 8.99, width: 15.5, height: 1 }
  - label: the door ledge, over the way in
    color: "#1C1A2E"
    rect_h: { x: 1, y: 6, width: 6, height: 2 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns:
  - type_id: blade_unit
    position_h: { x: 14, y: 1 }
    facing: left
  - type_id: rifle_unit
    position_h: { x: 18, y: 3.5 }
    facing: left
    armor_layers: 1
  - type_id: blade_unit
    position_h: { x: 33, y: 1 }
    facing: left
  - type_id: rifle_unit
    position_h: { x: 39.5, y: 2.5 }
    facing: left
    armor_layers: 1
  - type_id: dark_heavy_unit
    position_h: { x: 45, y: 1 }
    facing: left
    armor_layers: 2
    wave: 1
  - type_id: blade_unit
    position_h: { x: 47.5, y: 1 }
    facing: left
    wave: 1
  - type_id: blade_unit
    position_h: { x: 52, y: 3 }
    facing: left
    wave: 1
  - type_id: heavy_unit
    position_h: { x: 59.5, y: 7 }
    facing: left
    armor_layers: 1
    wave: 1
  - type_id: blade_unit
    position_h: { x: 47.92, y: 10.99 }
    facing: right
    wave: 2
  - type_id: blade_unit
    position_h: { x: 37.92, y: 11.99 }
    facing: right
    wave: 2
  - type_id: rifle_unit
    position_h: { x: 32.42, y: 11.99 }
    facing: right
    armor_layers: 1
    wave: 2
  - type_id: dark_blade_unit
    position_h: { x: 6, y: 8 }
    facing: right
    armor_layers: 2
    wave: 2
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 3.25
  y_h: 8
exit:
  x_h: 2
  y_h: 8
next_room_id: 10
