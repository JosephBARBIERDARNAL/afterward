# Room coordinates use H from the lower-left. Terrain and platform `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a block top.
room_id: 9
chapter_id: 1
description: "Gauntlet: low bridge, a divider wall and tower, sniper gallery, plank islands, final mound."
size:
  width_viewports: 4
  height_h: 18
background_profile: clouds_night_blue
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid blocks: they stop bodies and projectiles from every side.
terrain:
  - label: floor
    material: grassy_dark_cobble
    rect_h: { x: 0, y: 0, width: 64, height: 1 }
  - label: ceiling
    material: stone_dark_cobble
    rect_h: { x: 0, y: 17, width: 64, height: 1 }
  - label: left wall above the entrance doorway
    material: stone_dark_cobble
    rect_h: { x: 0, y: 4, width: 1, height: 13 }
  - label: right wall above the exit doorway
    material: stone_dark_cobble
    rect_h: { x: 63, y: 4, width: 1, height: 13 }
  - label: divider wall
    material: stone_rough_bricks
    rect_h: { x: 18, y: 6, width: 2, height: 11 }
  - label: tower
    material: stone_rough_bricks
    rect_h: { x: 20, y: 1, width: 3, height: 2 }
  - label: sniper gallery
    material: stone_bricks
    rect_h: { x: 24, y: 6, width: 10, height: 1 }
  - label: mound base
    material: grassy_dark_cobble
    rect_h: { x: 54, y: 1, width: 6, height: 2 }
  - label: mound top
    material: grassy_dark_cobble
    rect_h: { x: 56, y: 3, width: 3, height: 2 }
# One-way platforms: land on top, jump through from below, Down + Jump drops.
platforms:
  - material: metal_grate
    rect_h: { x: 6, y: 2.75, width: 8, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 15, y: 4.75, width: 3, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 21, y: 4.75, width: 3, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 35, y: 4.75, width: 3, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 38, y: 2.75, width: 3, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 42, y: 2.75, width: 2, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 45, y: 4.75, width: 2, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 48, y: 2.75, width: 2, height: 0.25 }
# Decorations: non-solid panels behind the terrain or in front of the bodies.
decorations:
  - label: sniper gallery strut
    material: metal_rusty_plates
    layer: background
    rect_h: { x: 25, y: 1, width: 0.5, height: 5 }
  - label: sniper gallery strut
    material: metal_rusty_plates
    layer: background
    rect_h: { x: 32.5, y: 1, width: 0.5, height: 5 }
enemy_spawns:
  - type_id: infantryman
    position_h: { x: 10, y: 3 }
  - type_id: gorgon_1
    position_h: { x: 8, y: 1 }
  - type_id: gorgon_2
    position_h: { x: 16.5, y: 5 }
  - type_id: swordsman
    position_h: { x: 21.5, y: 3 }
  - type_id: gorgon_3
    position_h: { x: 27, y: 1 }
  - type_id: destroyer
    position_h: { x: 26, y: 7 }
  - type_id: destroyer
    position_h: { x: 32, y: 7 }
  - type_id: gorgon_1
    position_h: { x: 38, y: 1 }
  - type_id: gorgon_3
    position_h: { x: 44, y: 1 }
  - type_id: gorgon_2
    position_h: { x: 46, y: 5 }
  - type_id: infantryman
    position_h: { x: 49, y: 3 }
  - type_id: gorgon_3
    position_h: { x: 55, y: 3 }
  - type_id: destroyer
    position_h: { x: 57.5, y: 5 }
  - type_id: swordsman
    position_h: { x: 61, y: 1 }
exit:
  x_h: 62
  y_h: 1
next_room_id: 10
