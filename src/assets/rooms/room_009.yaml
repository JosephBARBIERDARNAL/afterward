    position_h: { x: 21.5, y: 2 }
  - type_id: infantryman
    position_h: { x: 27.25, y: 2 }
  - type_id: gorgon_3
    position_h: { x: 32.75, y: 2 }
  - type_id: dark_ninja
    position_h: { x: 38.5, y: 2 }
  - type_id: destroyer
    position_h: { x: 44.25, y: 2 }
  - type_id: swordsman
    position_h: { x: 50, y: 2 }
  - type_id: gorgon_3
    position_h: { x: 55.75, y: 2 }
  - type_id: gorgon_1
    position_h: { x: 61.5, y: 2 }
  - type_id: gorgon_3
    position_h: { x: 67.25, y: 2 }
  - type_id: destroyer
