# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 9
chapter_id: 1
description: "A bare shell waiting for a layout: four viewports of floor, the last room before the boss."
size:
  width_viewports: 4
  height_h: 27
background_profile: clouds_night_blue
player_spawn:
  x_h: 3
  y_h: 2
# One-way platforms: land on top, pass through from every other side,
# Down + Jump drops through. They stop shots.
platforms:
  - label: the floor the room stands on
    material: city_pavement
    rect_h: { x: -2, y: 0, width: 100, height: 2 }
  - label: west wall
    material: city_plating
    rect_h: { x: -2, y: 2, width: 2, height: 25 }
  - label: east wall
    material: city_plating
    rect_h: { x: 96, y: 2, width: 2, height: 25 }
  - label: roofline
    material: city_plating
    rect_h: { x: -2, y: 27, width: 100, height: 2 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns:
  - type_id: gorgon_2
    position_h: { x: 10, y: 2 }
  - type_id: gorgon_1
    position_h: { x: 15.75, y: 2 }
