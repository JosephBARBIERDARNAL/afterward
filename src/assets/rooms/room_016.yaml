  - label: the ladder to mezzanine B
    kind: ladder
    position_h: { x: 36.5, y: 1 }
    height_h: 6.5
    colorway: dusk
  - kind: terminal
    position_h: { x: 3, y: 14 }
    text: "PLAZA. THE MARKET NEVER REOPENED."
    colorway: dusk
  - label: the beam under mezzanine A
    kind: laser
    position_h: { x: 16, y: 1 }
    color: red
    orientation: vertical
    length_h: 5.5
    off_s: 1.2
    warn_s: 0.5
    on_s: 1
    offset_s: 0
    damage: 15
    colorway: dusk
