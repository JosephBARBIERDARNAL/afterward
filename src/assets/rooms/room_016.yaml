# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 16
chapter_id: 2
size:
  width_h: 48
  height_h: 13.5
background_profiles: [dead_city_ephemeral]
hidden_background_layers: [dead_city_ephemeral/4, dead_city_ephemeral/5]
player_spawn:
  x_h: 2.5
  y_h: 2
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: start floor
    material: sci_fi_riveted_wall
    rect_h: { x: 0, y: 0, width: 9.5, height: 1.5 }
    colorway: dusk
  - label: start trim
    material: sci_fi_green_edge
    rect_h: { x: 0, y: 1.5, width: 9.5, height: 0.5 }
    colorway: dusk
  - label: under the fire
    material: sci_fi_riveted_wall
    rect_h: { x: 9.5, y: 0, width: 1, height: 1.5 }
    colorway: dusk
  - label: after the fire
    material: sci_fi_riveted_wall
    rect_h: { x: 10.5, y: 0, width: 1.5, height: 1.5 }
    colorway: dusk
  - label: after the fire trim
    material: sci_fi_green_edge
    rect_h: { x: 10.5, y: 1.5, width: 1.5, height: 0.5 }
    colorway: dusk
  - label: spike pit
    material: sci_fi_riveted_wall
    rect_h: { x: 12, y: 0, width: 3, height: 1 }
    colorway: dusk
  - label: before the belt
    material: sci_fi_riveted_wall
    rect_h: { x: 15, y: 0, width: 1, height: 1.5 }
    colorway: dusk
  - label: before the belt trim
    material: sci_fi_green_edge
    rect_h: { x: 15, y: 1.5, width: 1, height: 0.5 }
    colorway: dusk
  - label: under the belt
    material: sci_fi_riveted_wall
    rect_h: { x: 16, y: 0, width: 4, height: 1.75 }
    colorway: dusk
  - label: gap floor
    material: sci_fi_dark
    rect_h: { x: 20, y: 0, width: 7, height: 0.5 }
    colorway: dusk
  - label: island
    material: sci_fi_riveted_wall
    rect_h: { x: 27, y: 0, width: 1.5, height: 1.5 }
    colorway: dusk
  - label: island trim
    material: sci_fi_green_edge
    rect_h: { x: 27, y: 1.5, width: 1.5, height: 0.5 }
    colorway: dusk
  - label: second gap floor
    material: sci_fi_dark
    rect_h: { x: 28.5, y: 0, width: 5, height: 0.5 }
    colorway: dusk
  - label: last floor
    material: sci_fi_riveted_wall
    rect_h: { x: 33.5, y: 0, width: 14.5, height: 1.5 }
    colorway: dusk
  - label: last floor trim
    material: sci_fi_green_edge
    rect_h: { x: 33.5, y: 1.5, width: 14.5, height: 0.5 }
    colorway: dusk
  - label: press ceiling
    material: sci_fi_riveted_wall
    rect_h: { x: 35, y: 4.25, width: 2, height: 1.75 }
    colorway: dusk
  - label: press ceiling trim
    material: sci_fi_trim_ceiling
    rect_h: { x: 35, y: 4.25, width: 2, height: 0.5 }
    colorway: dusk
  - label: turret pedestal
    material: sci_fi_riveted_wall
    rect_h: { x: 41.5, y: 2, width: 1, height: 1 }
    colorway: dusk
  - label: wall over the door
    material: sci_fi_riveted_wall
    rect_h: { x: 44.5, y: 3.125, width: 1, height: 10.375 }
    colorway: dusk
  - label: ledge
    material: sci_fi_riveted_wall
    rect_h: { x: 4.75, y: 5.5, width: 3.75, height: 0.5 }
    colorway: dusk
  - label: ledge trim
    material: sci_fi_green_edge
    rect_h: { x: 4.75, y: 5.75, width: 3.75, height: 0.25 }
    colorway: dusk
  - label: left wall
    material: sci_fi_riveted_wall
    rect_h: { x: 0, y: 2, width: 0.5, height: 11.5 }
    colorway: dusk
  - label: right wall
    material: sci_fi_riveted_wall
    rect_h: { x: 47.5, y: 2, width: 0.5, height: 11.5 }
    colorway: dusk
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
# Props: sprites standing on a spot (the middle of their bottom edge).
props:
  - prop: sci_fi_steel_crate
    position_h: { x: 7, y: 6 }
    rotation_deg: 15
    opacity: 0.6
    colorway: dusk
  - prop: sci_fi_crate_stack
    position_h: { x: 1.25, y: 2 }
    mirrored: true
    colorway: dusk
# Devices: traps, moving and folding platforms, buttons, doors and
# ladders, each standing on a spot (the middle of its bottom edge).
devices:
  - label: ladder to the ledge
    kind: ladder
    position_h: { x: 4.5, y: 2 }
    height_h: 4
    colorway: dusk
  - label: laser gate
    kind: laser
    position_h: { x: 7, y: 2 }
    color: red
    orientation: vertical
    length_h: 3
    off_s: 1.2
    warn_s: 0.5
    on_s: 1
    offset_s: 0
    damage: 15
    colorway: dusk
  - label: grates in the floor
    kind: fire_trap
    position_h: { x: 10, y: 1.5 }
    color: orange
    cells: 2
    arm_s: 0.6
    burn_s: 1.2
    rest_s: 1.4
    offset_s: 0
    damage: 12
    colorway: dusk
  - label: spike pit
    kind: spikes
    position_h: { x: 13.5, y: 1 }
    cells: 6
    damage: 10
    colorway: dusk
  - label: belt
    kind: conveyor
    position_h: { x: 18, y: 1.75 }
    cells: 8
    speed_h_s: 2
    colorway: dusk
  - label: gap spikes
    kind: spikes
    position_h: { x: 23.5, y: 0.5 }
    cells: 14
    damage: 10
    colorway: dusk
  - label: ferry
    kind: hover_platform
    position_h: { x: 21.5, y: 1 }
    size: large
    travel_x_h: 4
    travel_y_h: 0
    speed_h_s: 1.5
    colorway: dusk
  - label: fold 1
    kind: folding_platform
    position_h: { x: 29.5, y: 2.5 }
    color: green
    stand_s: 0.6
    return_s: 2.5
    colorway: dusk
  - label: fold 2
    kind: folding_platform
    position_h: { x: 31.75, y: 2.5 }
    color: steel
    stand_s: 0.6
    return_s: 2.5
    colorway: dusk
  - label: press
    kind: press
    position_h: { x: 36, y: 2 }
    rest_s: 1.5
    hold_s: 0.6
    offset_s: 0
    damage: 25
    colorway: dusk
  - label: blade
    kind: blade
    position_h: { x: 39, y: 2 }
    travel_x_h: 0
    travel_y_h: 2.5
    speed_h_s: 2
    damage: 15
    colorway: dusk
  - label: turret
    kind: turret
    position_h: { x: 42, y: 3 }
    facing: left
    interval_s: 1.8
    offset_s: 0
    shot_speed_h_s: 9
    damage: 10
    colorway: dusk
  - label: button
    kind: button
    position_h: { x: 43.25, y: 2 }
    link: 1
    colorway: dusk
  - label: door
    kind: door
    position_h: { x: 45, y: 2 }
    link: 1
    colorway: dusk
  - label: light strip up
    kind: light_strip
    position_h: { x: 2.5, y: 3 }
    orientation: vertical
    length_h: 3
    colorway: dusk
  - label: light strip along
    kind: light_strip
    position_h: { x: 12, y: 7 }
    orientation: horizontal
    length_h: 5
    colorway: dusk
enemy_spawns: []
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 46
  y_h: 2
exit:
  x_h: 46.75
  y_h: 2
next_room_id: 17
