# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 7
chapter_id: 1
size:
  width_h: 34
  height_h: 40
background_profile: city_teal_evening
player_spawn:
  x_h: 2.25
  y_h: 37
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the ledge the whole room stands on
    color: "#1C1A2E"
    rect_h: { x: 1, y: 0, width: 32, height: 1 }
  - label: east wall
    color: "#1C1A2E"
    rect_h: { x: 33, y: 0, width: 1, height: 40 }
  - label: west wall
    color: "#1C1A2E"
    rect_h: { x: 0, y: 0, width: 1, height: 40 }
  - label: the mass under the spawn ledge
    color: "#1C1A2E"
    rect_h: { x: 1, y: 29, width: 5, height: 8 }
  - label: the step down from the spawn ledge
    color: "#1C1A2E"
    rect_h: { x: 6, y: 29, width: 2, height: 6 }
  - label: the balcony under the spawn ledge
    color: "#1C1A2E"
    rect_h: { x: 8, y: 31, width: 6, height: 2 }
  - label: the ledge out over the drop
    color: "#1C1A2E"
    rect_h: { x: 16, y: 30.75, width: 3, height: 0.25 }
  - label: the head of the fire escape
    color: "#1C1A2E"
    rect_h: { x: 20, y: 28.75, width: 2, height: 0.25 }
  - label: fire escape, the ramp down to the east wall
    color: "#1C1A2E"
    rect_h: { x: 21.34, y: 26.52, width: 9, height: 0.25 }
    rotation_deg: -30
  - label: fire escape, the landing on the east wall
    color: "#1C1A2E"
    rect_h: { x: 29, y: 20, width: 4, height: 2 }
  - label: fire escape, the ramp down to the roof
    color: "#1C1A2E"
    rect_h: { x: 20.66, y: 19.52, width: 9, height: 0.25 }
    rotation_deg: 30
  - label: the building in the middle, over the tunnel
    color: "#1C1A2E"
    rect_h: { x: 12, y: 4, width: 10, height: 11 }
  - label: the perch on the roof
    color: "#1C1A2E"
    rect_h: { x: 14, y: 17.25, width: 2.5, height: 0.25 }
  - label: the sniper's block over the west drop
    color: "#1C1A2E"
    rect_h: { x: 8, y: 19, width: 4, height: 1 }
  - label: west way down, step 1
    color: "#1C1A2E"
    rect_h: { x: 7, y: 12.25, width: 3, height: 0.25 }
  - label: west way down, the balcony on the wall
    color: "#1C1A2E"
    rect_h: { x: 1, y: 8, width: 4, height: 2 }
  - label: west way down, step 2
    color: "#1C1A2E"
    rect_h: { x: 6.5, y: 7.25, width: 3, height: 0.25 }
  - label: west way down, the block on the street
    color: "#1C1A2E"
    rect_h: { x: 1, y: 1, width: 3.5, height: 4 }
  - label: west way down, the last step
    color: "#1C1A2E"
    rect_h: { x: 4.5, y: 1, width: 2, height: 2 }
