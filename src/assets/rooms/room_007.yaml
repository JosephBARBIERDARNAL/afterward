# Room coordinates use H from the lower-left. Terrain and platform `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a block top.
room_id: 7
chapter_id: 1
description: "Hollow trees: three hanging trunks with zigzag plank ledges, low logs on the floor."
size:
  width_viewports: 3
  height_h: 22
background_profile: clouds_sunset_fire
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid blocks: they stop bodies and projectiles from every side.
terrain:
  - label: floor
    material: grassy_strata
    rect_h: { x: 0, y: 0, width: 48, height: 1 }
  - label: ceiling
    material: moss_big_leaves
    rect_h: { x: 0, y: 21, width: 48, height: 1 }
  - label: left wall above the entrance doorway
    material: stone_rough_bricks
    rect_h: { x: 0, y: 4, width: 1, height: 17 }
  - label: right wall above the exit doorway
    material: stone_rough_bricks
    rect_h: { x: 47, y: 4, width: 1, height: 17 }
  - label: hanging trunk
    material: red_rock_strata
    rect_h: { x: 10, y: 13, width: 2, height: 8 }
  - label: hanging trunk
    material: red_rock_strata
    rect_h: { x: 23, y: 13, width: 2, height: 8 }
  - label: hanging trunk
    material: red_rock_strata
    rect_h: { x: 36, y: 13, width: 2, height: 8 }
  - label: log
    material: grassy_strata
    rect_h: { x: 16, y: 1, width: 2, height: 1 }
  - label: log
    material: grassy_strata
    rect_h: { x: 30, y: 1, width: 2, height: 1 }
