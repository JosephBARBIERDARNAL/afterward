# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 7
chapter_id: 1
size:
  width_h: 72
  height_h: 30
background_profile: drowned_city
player_spawn:
  x_h: 3
  y_h: 2
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the floor the room stands on
    material: city_pavement
    rect_h: { x: -2, y: 0, width: 76, height: 2 }
  - label: west wall
    material: city_plating
    rect_h: { x: -2, y: 2, width: 2, height: 28 }
  - label: east wall
    material: city_plating
    rect_h: { x: 72, y: 2, width: 2, height: 28 }
  - label: roofline
    material: city_plating
    rect_h: { x: -2, y: 30, width: 76, height: 2 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns:
  - type_id: stalker_unit
    position_h: { x: 10, y: 2 }
  - type_id: breaker_unit
    position_h: { x: 15, y: 2 }
  - type_id: rifle_unit
    position_h: { x: 20.25, y: 2 }
  - type_id: heavy_unit
    position_h: { x: 25.25, y: 2 }
  - type_id: stalker_unit
    position_h: { x: 30.25, y: 2 }
  - type_id: blade_unit
    position_h: { x: 35.5, y: 2 }
  - type_id: scout_unit
    position_h: { x: 40.5, y: 2 }
  - type_id: breaker_unit
    position_h: { x: 45.75, y: 2 }
  - type_id: rifle_unit
    position_h: { x: 50.75, y: 2 }
  - type_id: lancer_unit
    position_h: { x: 55.75, y: 2 }
  - type_id: blade_unit
    position_h: { x: 61, y: 2 }
  - type_id: heavy_unit
    position_h: { x: 66, y: 2 }
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 67
  y_h: 2
exit:
  x_h: 69
  y_h: 2
next_room_id: 8
