# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 2
chapter_id: 1
description: "Two things the city teaches, in a row: fists on the open street, then the shaft whose walls are the only way up. The slab at x 44 seals the street, so the shaft is not a detour."
size:
  width_h: 72
  height_h: 27
background_profile: city_pink_dusk
player_spawn:
  x_h: 3
  y_h: 2
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the street the room opens on, run end to end
    material: city_pavement
    rect_h: { x: -2, y: 0, width: 76, height: 2 }
  - label: west wall
    material: city_plating
    rect_h: { x: -2, y: 2, width: 2, height: 25 }
  - label: east wall
    material: city_plating
    rect_h: { x: 72, y: 2, width: 2, height: 25 }
  - label: roofline
    material: city_plating
    rect_h: { x: -2, y: 27, width: 76, height: 2 }
  - label: shaft, the near wall - hangs clear of the street, so it is walked under
    material: city_plating
    rect_h: { x: 41, y: 4.5, width: 1.5, height: 6.5 }
  - label: shaft, the far wall - this is what seals the street
    material: city_plating
    rect_h: { x: 44.5, y: 2, width: 1.5, height: 9 }
  - label: the walkway the shaft comes out on
    material: city_plating
    rect_h: { x: 46, y: 10.5, width: 8, height: 0.5 }
  - color: "#1C1A2E"
    rect_h: { x: 6, y: 4, width: 1, height: 5 }
  - color: "#1C1A2E"
    rect_h: { x: 9, y: 4, width: 1, height: 5 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns:
  - label: waiting down the street
    type_id: stalker_unit
    position_h: { x: 38.5, y: 2 }
    facing: left
  - label: on the walkway, met on the way out of the shaft
    type_id: blade_unit
    position_h: { x: 50, y: 11 }
    facing: left
  - label: the last of them, between the shaft and the door
    type_id: stalker_unit
    position_h: { x: 60, y: 2 }
    facing: left
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 67
  y_h: 2
exit:
  x_h: 69
  y_h: 2
next_room_id: 3
