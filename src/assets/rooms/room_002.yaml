# Room coordinates use H from the lower-left. Terrain and platform `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a block top.
# Layout: Ziggurat hall: a stepped stone mound under hanging rock, shooters on its tiers.
room_id: 2
chapter_id: 1
size:
  width_viewports: 2
  height_h: 16
background_profile: chapter_01_forest
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid blocks: they stop bodies and projectiles from every side.
terrain:
  - surface: soil # floor
    rect_h: { x: 0, y: 0, width: 32, height: 1 }
  - surface: stone # ceiling
    rect_h: { x: 0, y: 15, width: 32, height: 1 }
  - surface: stone # left wall above the entrance doorway
    rect_h: { x: 0, y: 4, width: 1, height: 11 }
  - surface: stone # right wall above the exit doorway
    rect_h: { x: 31, y: 4, width: 1, height: 11 }
  - surface: stone # ziggurat base
    rect_h: { x: 11, y: 1, width: 10, height: 2 }
  - surface: stone # ziggurat middle
    rect_h: { x: 13, y: 3, width: 6, height: 2 }
  - surface: stone # ziggurat top
    rect_h: { x: 15, y: 5, width: 2, height: 2 }
  - surface: stone # hanging rock
    rect_h: { x: 6, y: 11, width: 5, height: 4 }
  - surface: stone # hanging rock
    rect_h: { x: 22, y: 10, width: 4, height: 5 }
# One-way platforms: land on top, jump through from below, Down + Jump drops.
platforms:
  - surface: wood
    rect_h: { x: 3, y: 2.75, width: 4, height: 0.25 }
  - surface: wood
    rect_h: { x: 24, y: 2.75, width: 4, height: 0.25 }
  - surface: wood
    rect_h: { x: 26, y: 4.75, width: 4, height: 0.25 }
decorations: []
enemy_spawns:
  - type_id: swordsman
    position_h: { x: 8, y: 1 }
  - type_id: infantryman
    position_h: { x: 14, y: 5 }
  - type_id: infantryman
    position_h: { x: 16, y: 7 }
  - type_id: infantryman
    position_h: { x: 28.5, y: 5 }
  - type_id: swordsman
    position_h: { x: 23, y: 1 }
  - type_id: gorgon_1
    position_h: { x: 25, y: 3 }
exit:
  x_h: 29.5
  y_h: 1
next_room_id: 3
