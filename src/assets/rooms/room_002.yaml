# Room coordinates use H from the lower-left. Terrain and platform `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a block top.
room_id: 2
chapter_id: 1
description: "Ziggurat hall: a stepped stone mound under hanging rock, shooters on its tiers."
size:
  width_viewports: 2
  height_h: 16
background_profile: chapter_01_hills
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid blocks: they stop bodies and projectiles from every side.
terrain:
  - label: floor
    material: grassy_cobble
    rect_h: { x: 0, y: 0, width: 32, height: 1 }
  - label: ceiling
    material: stone_dark_cobble
    rect_h: { x: 0, y: 15, width: 32, height: 1 }
  - label: left wall above the entrance doorway
    material: stone_cobble
    rect_h: { x: 0, y: 4, width: 1, height: 11 }
  - label: right wall above the exit doorway
    material: stone_cobble
    rect_h: { x: 31, y: 1, width: 1, height: 14 }
  - label: ziggurat base
    material: stone_bricks
    rect_h: { x: 11, y: 1, width: 10, height: 2 }
  - label: ziggurat middle
    material: stone_bricks
    rect_h: { x: 13, y: 3, width: 6, height: 2 }
  - label: ziggurat top
    material: mossy_bricks
    rect_h: { x: 15, y: 5, width: 2, height: 2 }
  - label: hanging rock
    material: stone_dark_cobble
    rect_h: { x: 6, y: 11, width: 5, height: 4 }
  - label: hanging rock
    material: stone_dark_cobble
    rect_h: { x: 22, y: 10, width: 4, height: 5 }
# One-way platforms: land on top, jump through from below, Down + Jump drops.
platforms:
  - material: stone_slab
    rect_h: { x: 3, y: 2.75, width: 4, height: 0.25 }
  - material: stone_slab
    rect_h: { x: 24, y: 2.75, width: 4, height: 0.25 }
  - material: stone_slab
    rect_h: { x: 26, y: 4.75, width: 4, height: 0.25 }
# Decorations: non-solid panels behind the terrain or in front of the bodies.
decorations: []
enemy_spawns:
  - type_id: swordsman
    position_h: { x: 8, y: 1 }
  - type_id: infantryman
    position_h: { x: 14, y: 5 }
  - type_id: infantryman
    position_h: { x: 16, y: 7 }
  - type_id: infantryman
    position_h: { x: 28.5, y: 5 }
  - type_id: swordsman
    position_h: { x: 23, y: 1 }
  - type_id: gorgon_1
    position_h: { x: 25, y: 3 }
exit:
  x_h: 30
  y_h: 1
next_room_id: 3
