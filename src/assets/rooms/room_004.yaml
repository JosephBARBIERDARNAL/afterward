# Room coordinates use H from the lower-left. Terrain and platform `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a block top.
# Layout: Cliff descent: enter high on a cliff, fight down its steps, then up to a sniper perch.
room_id: 4
chapter_id: 1
size:
  width_viewports: 2
  height_h: 18
background_profile: chapter_01_hills
player_spawn:
  x_h: 2.5
  y_h: 9
# Solid blocks: they stop bodies and projectiles from every side.
terrain:
  - surface: soil # cliff
    rect_h: { x: 0, y: 0, width: 10, height: 9 }
  - surface: soil # upper step
    rect_h: { x: 10, y: 0, width: 3, height: 7 }
  - surface: soil # lower step
    rect_h: { x: 13, y: 0, width: 3, height: 5 }
  - surface: soil # floor
    rect_h: { x: 16, y: 0, width: 16, height: 1 }
  - surface: stone # ceiling
    rect_h: { x: 0, y: 17, width: 32, height: 1 }
  - surface: stone # left wall above the entrance doorway
    rect_h: { x: 0, y: 12, width: 1, height: 5 }
  - surface: stone # right wall above the exit doorway
    rect_h: { x: 31, y: 4, width: 1, height: 13 }
  - surface: stone # sniper perch
    rect_h: { x: 25, y: 6, width: 5, height: 1 }
# One-way platforms: land on top, jump through from below, Down + Jump drops.
platforms:
  - surface: wood
    rect_h: { x: 17, y: 2.75, width: 3, height: 0.25 }
  - surface: wood
    rect_h: { x: 22, y: 4.75, width: 3, height: 0.25 }
decorations: []
enemy_spawns:
  - type_id: swordsman
    position_h: { x: 8, y: 9 }
  - type_id: infantryman
    position_h: { x: 11.5, y: 7 }
  - type_id: gorgon_1
    position_h: { x: 14.5, y: 5 }
  - type_id: infantryman
    position_h: { x: 18.5, y: 3 }
  - type_id: destroyer
    position_h: { x: 27.5, y: 7 }
  - type_id: swordsman
    position_h: { x: 21, y: 1 }
  - type_id: gorgon_1
    position_h: { x: 29, y: 1 }
  - type_id: destroyer
    position_h: { x: 23.5, y: 5 }
exit:
  x_h: 30
  y_h: 1
next_room_id: 5
