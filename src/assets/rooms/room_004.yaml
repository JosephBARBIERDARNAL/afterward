# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 4
chapter_id: 1
description: "A bare shell waiting for a layout, tall rather than wide: the room meant to be read from top to bottom."
size:
  width_h: 48
  height_h: 40.5
background_profile: clouds_golden_tower
player_spawn:
  x_h: 3
  y_h: 2
# One-way platforms: land on top, pass through from every other side,
# Down + Jump drops through. They stop shots.
platforms:
  - label: the floor the room stands on
    material: city_pavement
    rect_h: { x: -2, y: 0, width: 52, height: 2 }
  - label: west wall
    material: city_plating
    rect_h: { x: -2, y: 2, width: 2, height: 38.5 }
  - label: east wall
    material: city_plating
    rect_h: { x: 48, y: 2, width: 2, height: 38.5 }
  - label: roofline
    material: city_plating
    rect_h: { x: -2, y: 40.5, width: 52, height: 2 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns:
  - type_id: swordsman
    position_h: { x: 10, y: 2 }
  - type_id: gorgon_1
    position_h: { x: 14, y: 2 }
  - type_id: infantryman
    position_h: { x: 18, y: 2 }
  - type_id: infantryman
    position_h: { x: 22, y: 2 }
  - type_id: swordsman
    position_h: { x: 26, y: 2 }
  - type_id: destroyer
    position_h: { x: 30, y: 2 }
  - type_id: infantryman
    position_h: { x: 34, y: 2 }
  - type_id: destroyer
    position_h: { x: 38, y: 2 }
  - type_id: gorgon_1
    position_h: { x: 42, y: 2 }
exit:
  x_h: 45
  y_h: 2
next_room_id: 5
