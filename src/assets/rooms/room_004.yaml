# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 4
chapter_id: 1
description: "The descent: a tower read from top to bottom and back. The door is in sight across the top, but the wall between seals it off, so the way there is down the left side floor by floor, under the wall, and up the right by ledges and a shaft."
size:
  width_h: 34
  height_h: 40
background_profile: city_peach_sunset
player_spawn:
  x_h: 2.5
  y_h: 37
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
