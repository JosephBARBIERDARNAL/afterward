# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 6
chapter_id: 1
size:
  width_h: 48
  height_h: 36
background_profile: drowned_city
player_spawn:
  x_h: 3
  y_h: 2
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the floor the room stands on
    material: city_pavement
    rect_h: { x: -2, y: 0, width: 52, height: 2 }
  - label: west wall
    material: city_plating
    rect_h: { x: -2, y: 2, width: 2, height: 34 }
  - label: east wall
    material: city_plating
    rect_h: { x: 48, y: 2, width: 2, height: 34 }
  - label: roofline
    material: city_plating
    rect_h: { x: -2, y: 36, width: 52, height: 2 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns:
  - type_id: breaker_unit
    position_h: { x: 10, y: 2 }
  - type_id: stalker_unit
    position_h: { x: 13.25, y: 2 }
  - type_id: scout_unit
    position_h: { x: 16.5, y: 2 }
  - type_id: rifle_unit
    position_h: { x: 19.5, y: 2 }
  - type_id: stalker_unit
    position_h: { x: 22.75, y: 2 }
  - type_id: heavy_unit
    position_h: { x: 26, y: 2 }
  - type_id: lancer_unit
    position_h: { x: 29.25, y: 2 }
  - type_id: heavy_unit
    position_h: { x: 32.5, y: 2 }
  - type_id: rifle_unit
    position_h: { x: 35.5, y: 2 }
  - type_id: blade_unit
    position_h: { x: 38.75, y: 2 }
  - type_id: lancer_unit
    position_h: { x: 42, y: 2 }
# The bonus item, lying beside the door once every enemy is down.
bonus:
  x_h: 43
  y_h: 2
exit:
  x_h: 45
  y_h: 2
next_room_id: 7
