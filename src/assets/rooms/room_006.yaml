# Room coordinates use H from the lower-left. Terrain and platform `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a block top.
room_id: 6
chapter_id: 1
description: "Hollow arena: wall ledges on both sides, plank tiers around a high central bridge."
size:
  width_viewports: 2
  height_h: 18
background_profile: chapter_01_autumn_canopy
player_spawn:
  x_h: 2.5
  y_h: 1
# Solid blocks: they stop bodies and projectiles from every side.
terrain:
  - label: floor
    material: grassy_red_rock
    rect_h: { x: 0, y: 0, width: 32, height: 1 }
  - label: ceiling
    material: brick_red
    rect_h: { x: 0, y: 17, width: 32, height: 1 }
  - label: left wall above the entrance doorway
    material: brick_overgrown
    rect_h: { x: 0, y: 4, width: 1, height: 13 }
  - label: right wall above the exit doorway
    material: brick_overgrown
    rect_h: { x: 31, y: 4, width: 1, height: 13 }
  - label: west ledge
    material: mossy_red_brick
    rect_h: { x: 1, y: 4, width: 5, height: 1 }
  - label: east ledge
    material: mossy_red_brick
    rect_h: { x: 26, y: 4, width: 5, height: 1 }
  - label: west high ledge
    material: mossy_red_brick
    rect_h: { x: 1, y: 8, width: 4, height: 1 }
  - label: east high ledge
    material: mossy_red_brick
    rect_h: { x: 27, y: 8, width: 4, height: 1 }
  - label: hanging pillar
    material: brick_block
    rect_h: { x: 15, y: 12, width: 2, height: 5 }
# One-way platforms: land on top, jump through from below, Down + Jump drops.
platforms:
  - material: wood_planks
    rect_h: { x: 7, y: 2.75, width: 3, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 22, y: 2.75, width: 3, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 8, y: 6.75, width: 3, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 21, y: 6.75, width: 3, height: 0.25 }
  - material: wood_dark_planks
    rect_h: { x: 12, y: 8.75, width: 8, height: 0.25 }
  - material: wood_planks
    rect_h: { x: 14, y: 4.75, width: 4, height: 0.25 }
# Decorations: non-solid panels behind the terrain or in front of the bodies.
decorations: []
enemy_spawns:
  - type_id: swordsman
    position_h: { x: 4, y: 5 }
  - type_id: gorgon_1
    position_h: { x: 8.5, y: 3 }
  - type_id: infantryman
    position_h: { x: 3, y: 9 }
  - type_id: gorgon_2
    position_h: { x: 16, y: 5 }
  - type_id: gorgon_3
    position_h: { x: 13, y: 9 }
  - type_id: swordsman
    position_h: { x: 19, y: 9 }
  - type_id: gorgon_1
    position_h: { x: 23.5, y: 3 }
  - type_id: destroyer
    position_h: { x: 29, y: 9 }
  - type_id: infantryman
    position_h: { x: 28, y: 5 }
  - type_id: destroyer
    position_h: { x: 16, y: 1 }
exit:
  x_h: 29.5
  y_h: 1
next_room_id: 7
