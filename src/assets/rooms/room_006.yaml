    position_h: { x: 16.5, y: 2 }
  - type_id: infantryman
    position_h: { x: 19.5, y: 2 }
  - type_id: gorgon_1
    position_h: { x: 22.75, y: 2 }
  - type_id: destroyer
    position_h: { x: 26, y: 2 }
  - type_id: gorgon_2
    position_h: { x: 29.25, y: 2 }
  - type_id: destroyer
    position_h: { x: 32.5, y: 2 }
  - type_id: infantryman
    position_h: { x: 35.5, y: 2 }
  - type_id: swordsman
    position_h: { x: 38.75, y: 2 }
  - type_id: gorgon_2
