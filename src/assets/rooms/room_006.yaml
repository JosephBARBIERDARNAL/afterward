# Room coordinates use H from the lower-left. Platform and decoration `rect_h`
# give each block's lower-left corner and size; player, enemy, and exit y
# values mark the feet baseline on a platform top.
room_id: 6
chapter_id: 1
size:
  width_h: 48
  height_h: 16
background_profiles: [city_teal_evening]
player_spawn:
  x_h: 2.75
  y_h: 7
# Solid platforms: land on their top, stop against their sides, bump
# your head on their underside. They stop shots too.
platforms:
  - label: the ledge the whole room stands on
    color: "#1C1A2E"
    rect_h: { x: 1, y: 0, width: 46, height: 1 }
  - label: east wall
    color: "#1C1A2E"
    rect_h: { x: 47, y: 0, width: 1, height: 16 }
  - label: west wall
    color: "#1C1A2E"
    rect_h: { x: 0, y: 0, width: 1, height: 16 }
  - label: the tower the room is entered on
    color: "#1C1A2E"
    rect_h: { x: 1, y: 1, width: 6, height: 6 }
  - label: stairs down, step 1
    color: "#1C1A2E"
    rect_h: { x: 7, y: 1, width: 3, height: 4 }
  - label: stairs down, step 2
    color: "#1C1A2E"
    rect_h: { x: 10, y: 1, width: 3, height: 2 }
  - label: the step up to the lookout
    color: "#1C1A2E"
    rect_h: { x: 8.5, y: 8.75, width: 2.5, height: 0.25 }
  - label: the lookout over the valley
    color: "#1C1A2E"
    rect_h: { x: 13, y: 9, width: 4, height: 1 }
  - label: the ledge across the valley
    color: "#1C1A2E"
    rect_h: { x: 16, y: 2.75, width: 4, height: 0.25 }
  - label: the pillar
    color: "#1C1A2E"
    rect_h: { x: 22, y: 1, width: 4, height: 4 }
  - label: the ramp from the pillar to the roof
    color: "#1C1A2E"
    rect_h: { x: 25.84, y: 5.76, width: 5.9, height: 0.25 }
    rotation_deg: 20
  - label: the roof over the tunnel
    color: "#1C1A2E"
    rect_h: { x: 31.5, y: 4, width: 6.5, height: 3 }
  - label: way out of the pit, step 1
    color: "#1C1A2E"
    rect_h: { x: 41.5, y: 3.25, width: 1.5, height: 0.25 }
  - label: way out of the pit, step 2
    color: "#1C1A2E"
    rect_h: { x: 38, y: 5.5, width: 1.5, height: 0.25 }
  - label: the step up to the door tower
    color: "#1C1A2E"
    rect_h: { x: 39.75, y: 8.75, width: 1.75, height: 0.25 }
  - label: the door tower
    color: "#1C1A2E"
    rect_h: { x: 43, y: 1, width: 4, height: 9 }
# Decorations: non-solid panels behind the platforms or in front of the bodies.
decorations: []
enemy_spawns:
