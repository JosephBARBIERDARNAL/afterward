# Shared chapter scenery. Layers are listed back-to-front and preserve the
# source image's dimensions; each layer scrolls at its configured parallax rate.
# `filtering: nearest` samples the low-resolution pixel art without smoothing,
# so it stays crisp instead of blurry when scaled up on large displays.
profiles:
  # City skylines (craftpix.net). `layer-1` is the opaque sky; higher layers
  # are nearer rows of buildings. The front row stops at 0.5 because rooms
  # draw their own ground.
  city_night_stars:
    backdrop: background/city/night-stars/layer-1.png
    source_size_px: { width: 576, height: 324 }
    tile_h: 13.5
    repeat_horizontal: true
    filtering: nearest
    layers:
      - asset: background/city/night-stars/layer-2.png
        parallax: 0.08
      - asset: background/city/night-stars/layer-3.png
        parallax: 0.18
      - asset: background/city/night-stars/layer-4.png
        parallax: 0.32
      - asset: background/city/night-stars/layer-5.png
        parallax: 0.5
