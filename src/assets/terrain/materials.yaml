# Terrain materials: how solid blocks, one-way platforms, and decoration panels
# look and sound. Room files name one material per block (`material:`).
#
# Textures are seamless 16 px squares from the "Textures16x16" pack by Androx
# (terrain/textures/README.txt; terrain/textures/overview.png shows them all).
# They tile in world space, so neighboring blocks of one material line up.

texture_px: 16
# One 16 px tile spans 0.25 H (64 px per H), close to the player sprite's
# pixel density (60 px per H), and matches the editor's 0.25 H grid.
texture_tile_h: 0.25

# Drawn along every block edge that no other block covers, so blocks read
# clearly against the backgrounds. Thicknesses are in texture pixels.
edges:
  outline_color: "#10111C"
  outline_alpha: 0.9
  outline_px: 1
  highlight_color: "#FFFFFF"
  highlight_alpha: 0.22
  highlight_px: 1

# Decoration panels are non-solid. Background panels sit behind the terrain
# and are tinted darker so they read as distant; foreground panels are drawn
# over the bodies.
decoration_layers:
  background:
    tint: "#6E7590"
    alpha: 1
  foreground:
    tint: "#FFFFFF"
    alpha: 1

materials:
  # Capped materials: a fill texture with a strip of grass or moss on top.
  grassy_cobble:
    texture: terrain/textures/stone/cobble.png
    top: { texture: terrain/textures/grass/tall.png, depth_px: 7 }
    footstep: soil
  grassy_dark_cobble:
    texture: terrain/textures/stone/dark_cobble.png
    top: { texture: terrain/textures/grass/speckled.png, depth_px: 7 }
    footstep: soil
  grassy_pale_cobble:
    texture: terrain/textures/stone/pale_cobble.png
    top: { texture: terrain/textures/grass/tall.png, depth_px: 7 }
    footstep: soil
  grassy_red_rock:
    texture: terrain/textures/red_rock/cobble.png
    top: { texture: terrain/textures/grass/dense.png, depth_px: 7 }
    footstep: soil
  grassy_strata:
    texture: terrain/textures/red_rock/strata.png
    top: { texture: terrain/textures/grass/tall.png, depth_px: 7 }
    footstep: soil
  mossy_cobble:
    texture: terrain/textures/stone/cobble.png
    top: { texture: terrain/textures/moss/leaves.png, depth_px: 5 }
    footstep: stone
  mossy_bricks:
