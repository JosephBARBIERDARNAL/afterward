viewport:
  aspect_ratio: { width: 16, height: 9 }
  # The player is 1 H tall, so a taller view shows them (and the enemies)
  # smaller. 13.5 H keeps the viewport a whole 24 H wide.
  height_h: 13.5

# The camera follows the player on both axes, clamped to the room bounds. It
# moves vertically only once the player is this far above or below the
# screen center, so ordinary jumps do not shake the view.
camera:
  vertical_dead_zone_h: 1.5

player:
  max_health: 100
  # Where enemy strikes and projectiles hit the player: centered on the body,
  # from the feet up. B in debug builds draws every hitbox.
  hurtbox_h: { width: 0.5, height: 1 }
  max_speed_h_s: 6
  air_max_speed_h_s: 6
  acceleration_h_s2: 36
  deceleration_h_s2: 48
  jump_height_h: 2.925
  gravity_h_s2: 32
  # The steepest face of a turned platform (`rotation_deg` in a room file) a
  # body still walks, the player and the enemies alike. A steeper face is a
  # wall: it stops a body and lets it slide down.
  walkable_slope_deg: 40
  jump_impulse_h_s: 13.68
  jumps_per_takeoff: 1
  # Releasing jump while rising multiplies the upward velocity by this factor,
  # so a tap gives a short hop and holding the button gives the full jump.
  jump_release_velocity_multiplier: 0.5
  # A Jump pressed this long before it can be obeyed (still falling, still
  # rolling) is remembered and thrown the moment it can.
  jump_buffer_s: 0.1
  damage_invulnerability_s: 0.55
  # Holding Down on the ground crouches; the crouch walk is slower.
  crouch_speed_h_s: 3
  # Holding Cover on the ground raises a guard: the player can neither move
  # nor strike, and damage from enemies in front is multiplied by this.
  cover_damage_taken_multiplier: 0.5
  # Dying plays the death animation, then holds its last frame this long
  # before the run ends.
  death_hold_s: 0.6
  # The player's only weapon: a melee chain. Each press of Attack lands the
  # next blow of `steps`; once a blow ends there is `combo_window_s` to ask
  # for the next, and letting that lapse drops the chain back to its first
  # step. `hitbox_h` is measured from the player's feet, `x` pointing the way
  # they face, like an enemy attack's (B in debug builds draws them all).
  # `lunge_h_s` is the speed a blow carries the player forward at until it
  # connects, and never slower than they were already running: a blow thrown
  # on the move keeps its momentum. The lunge stops short once the blow can
  # reach a body, so it closes the distance without running through anyone.
  melee:
    combo_window_s: 0.55
    # An Attack pressed this long before the next blow can be thrown (the one
    # in hand still playing, a roll still under way) is remembered and thrown
    # the moment it can, so mashing never drops a press.
    buffer_s: 0.2
    # The shove a blow gives a body with no armor up, away from the player.
    knockback_h_s: 3.5
    boss_knockback_h_s: 2.5
    # What a landed blow does to the moment. The whole game holds still for
    # `freeze_s` (`kill_freeze_s` when the blow kills), the camera is thrown
    # `shake_h` off its mark (`heavy_shake_h` for the chain's last blow, the
    # charged blow, the slam and any kill) and settles over `shake_s`, and the
    # body that was hit flares `flash_brightness` times brighter for `flash_s`.
    impact:
      freeze_s: 0.05
      kill_freeze_s: 0.11
      shake_h: 0.03
      heavy_shake_h: 0.07
      shake_s: 0.18
      flash_s: 0.07
      flash_brightness: 3
    steps:
      - strike: strike_1
        damage: 18
        hitbox_h: { x: 0.15, y: 0.2, width: 0.8, height: 0.5 }
        contact_s: 0.12
        lunge_h_s: 4
      - strike: strike_2
        damage: 20
        hitbox_h: { x: 0.15, y: 0.2, width: 0.85, height: 0.55 }
        contact_s: 0.14
        lunge_h_s: 4
      - strike: kick
        damage: 30
        hitbox_h: { x: 0.2, y: 0.15, width: 1, height: 0.5 }
        contact_s: 0.11
        lunge_h_s: 6
      # The finishers. A step naming a bonus is only thrown by a run that
      # owns it, and it is thrown *instead of* nothing rather than alongside
      # the others: a run holding several throws the last of them listed
      # here, so this order is the order they outrank each other in.
      - strike: power_strike
        damage: 38
        hitbox_h: { x: 0.15, y: 0.2, width: 1, height: 0.55 }
        contact_s: 0.22
        lunge_h_s: 5
        requires_bonus: power_strike
      - strike: fire_kick
        damage: 45
        hitbox_h: { x: 0.15, y: 0.2, width: 1.1, height: 0.55 }
        contact_s: 0.19
        lunge_h_s: 5
        requires_bonus: fire_kick
      # The one blow that lands on every side at once, so it is worth less
      # against a single body and far more in the middle of a crowd.
      - strike: explosive_strike
        damage: 30
        hitbox_h: { x: 0, y: 0, width: 1.2, height: 1 }
        both_sides: true
        contact_s: 0.18
        lunge_h_s: 0
        requires_bonus: explosive_strike
    # Attack with Down held in mid-air drives the player straight at the
    # floor; the landing breaks it, hurting everything to both sides. It is
    # the one answer to a crowd met from above.
    slam:
      damage: 34
      hitbox_h: { x: 0, y: 0, width: 1.6, height: 0.6 }
      drop_speed_h_s: 22
    # Attack held rather than tapped: once the blow in hand has ended, the
    # player gathers for `ready_s`, and letting go then throws one heavy blow
    # that goes through a shield instead of being soaked by it.
    charge:
      ready_s: 0.7
      damage: 40
      hitbox_h: { x: 0.15, y: 0.15, width: 1.1, height: 0.6 }
      contact_s: 0.2
      lunge_h_s: 6
    # The effect played where a blow lands, and how tall each is drawn: sparks
    # thrown the way the blow went for an ordinary one, a burst for a heavy
    # one (the chain's last blow, the charged blow, the slam), and a ring
    # opening out of a flash for one that kills. Their sheets and frame rates
    # are in `src/game/assets/effect_sheets.rs`.
    hit_effect: { spark_size_h: 0.9, burst_size_h: 1.1, kill_size_h: 1.3 }
  # Down and Jump together on the ground: a forward roll that carries the
  # player clear. Nothing can hurt them between `invulnerable_from_s` and
  # `invulnerable_to_s` of it, which is the only way through a shot.
  roll:
    speed_h_s: 9
    invulnerable_from_s: 0.1
    invulnerable_to_s: 0.4
  # Clinging to a platform's side and pushing off it, Mario style: a player
  # pressed into a wall in mid-air slides down it instead of falling, and Jump
  # throws them up and away. The lock keeps movement input off them for a
  # moment so they actually leave the wall.
  wall:
    slide_speed_h_s: 3
    jump_impulse_h_s: 12
    jump_push_h_s: 7
    control_lock_s: 0.18

# The healing a dying enemy sometimes leaves behind: the medical cross of
# `sprite`, drawn `size_h` tall where the enemy fell.
health_pickup:
  healing: 10
  base_drop_chance: 0.04
  sprite: pickups/health.png
  sprite_size_px: { width: 24, height: 24 }
  size_h: 0.4

room_flow:
  clear_animation_s: 0.5
  bonus_reroll_animation_s: 0.8
  # How long the bonus screen stays up after a bonus is chosen, so the droplet
  # has time to land on the box that was pressed before the room comes back.
  bonus_chosen_hold_s: 0.35
  boss_intro_duration_s: 0.9
  room_transition_duration_s: 0.8
  # Room entrance, played every time a room opens: the player walks in from
  # the left and stops on `player_spawn` (input locked), holds idle, then the
  # enemies materialize one after another (spread evenly over
  # `enemy_appear_spread_s`, each taking `enemy_appear_s`) before combat starts.
  room_intro:
    # The entrance begins before the camera has landed: the entry door opens
    # and the player starts walking out of it this long before the slide ends,
    # so the room is already being entered as it slides into frame.
    early_start_s: 0.4
    player_walk_in_s: 0.5
    player_walk_in_speed_h_s: 3
    player_fade_in_s: 0.2
    player_idle_hold_s: 0.3
    enemy_appear_s: 0.4
    enemy_appear_spread_s: 0.45
    fight_start_delay_s: 0.2
  exit_side: right
  # Rooms are not cut apart: the camera slides out of the room being left into
  # the next one, which stands `room_gap_h` further right across a dark gap.
  # The slide runs at `room_pan_speed_h_s`, so a long crossing takes longer
  # than a short one instead of every door feeling different. The player walks
  # into the door behind them and steps out of the entry door on the far side.
  room_pan_speed_h_s: 22
  room_gap_h: 1.5
  # The exit door stands on the room's `exit`, locked until a bonus is picked.
  # Sheet frames, left to right: 0 locked, 1 unlocked, then the opening, played
  # over the first half of the room transition.
  exit_door:
    sheet: doors/exit_door.png
    frame_size_px: { width: 48, height: 96 }
    frames: 14
    height_h: 1.5
  # The bonus item lying on the room's `bonus` spot once every enemy is down.
  # Its category is drawn at random; Interact pressed within `reach_h` of it
  # opens the bonus screen, which then offers two bonuses of that category. It
  # is the same obelisk whatever the category, told apart by the colour of its
  # glow: `sheet` is one row of `frames` frames played in a loop at `fps`, the
  # hover and the shadow under it being part of the drawing, and a frame is
  # drawn `height_h` tall with its foot on the spot.
  bonus_pickup:
    sheet: pickups/flying_obelisk.png
    frame_size_px: { width: 200, height: 400 }
    frames: 13
    fps: 10
    height_h: 2
    reach_h: 0.7
  # The bonus item and the unlocked door are used with Interact, never by
  # walking into them. The door is in reach `door_reach_x_h` to either side of
  # it and `door_reach_y_h` above or below its middle. The nearest thing in
  # reach wears a badge naming the key Interact is bound to: `badge_size_h`
  # tall, standing `badge_gap_h` over it, grown in over `pop_s` and hovering
  # `bob_height_h` up and down over `bob_period_s`.
  interact:
    door_reach_x_h: 0.9
    door_reach_y_h: 1.0
    badge_size_h: 0.45
    badge_gap_h: 0.3
    pop_s: 0.12
    bob_height_h: 0.04
    bob_period_s: 1.4
  bonus_rerolls_per_run: 3

# The words the city is entered on, typed out over the water between the
# opening room and room 1. `characters_per_s` is how fast they are written and
# `veil_fade_s` how long the water takes to rise over the room and to drain
# away again. They stand until the player presses the Enter button under them;
# pressing it while they are still being written finishes them at once.
prologue:
  characters_per_s: 26
  veil_fade_s: 0.8
  typing_sound: { asset: audio/sfx/typing.wav, gain: 0.5 }
  lines:
    - YOU ARE ABOUT TO ENTER AFTERWARD.
    - A CITY WHERE YOU WILL ONLY FIND ENEMIES.
    - ONE HUNDRED PLACES, EACH WORSE THAN THE LAST.
    - ONE WAY IN. NO WAY OUT.
    - THE ONLY EXIT IS AT THE END.

# The difficulty asked for on the way into a run, between the main menu and
# room 0. Nothing reads the choice yet: it is remembered and changes nothing.
# Each box on that screen is edged in its own colour, easiest first.
difficulty:
  easy: "#58AD68"
  normal: "#4F8FD6"
  hard: "#D74444"

# The 2D material shaders (`src/game/shaders/`). Everything here is meant to be
# felt rather than noticed: turn a number up to see what it does, then back.
effects:
  # The lit windows and stars of the background layers breathe. A light is
  # found rather than authored: a pixel whose brightness stands `light_threshold`
  # above the four around it, judged over a `light_softness` margin, and whose
  # surroundings are darker than `surround_ceiling` — which is what tells a
  # window on a dark facade from the dither of a bright sky.
  city_lights:
    light_threshold: 0.04
    light_softness: 0.08
    surround_ceiling: 0.3
    # The widest a light's brightness swings, and how long one breath takes.
    # Each light draws its own swing and phase, so most barely move.
    swing: 0.5
    period_s: 6
  # The pool of light behind anything the player should walk towards.
  glow:
    # How bright its core is, how far that swings, and how long one pulse takes.
    strength: 0.45
    pulse: 0.25
    pulse_period_s: 2.8
    # How far the light reaches past what it wraps, in H.
    bonus_radius_h: 0.8
    health_radius_h: 0.6
    door_radius_h: 1.2
    # How much brighter the aura of the thing within reach of Interact burns.
    reach_boost: 1.6
    # A bonus item lights in its category's colour; these two light in their own.
    health_color: "#4CF07A"
    door_color: "#7FD4FF"
  # The flood the city drowned in, and the water the main menu is drawn over:
  # a web of cold light wandering over deep wine cells, quantized to a pixel
  # grid and to the four tones below.
  flood:
    # How many water pixels fit in one H; the game's own art is 64 px per H.
    pixels_per_h: 32
    # How wide one cell of the web is, in H.
    cell_h: 2.4
    # How many turns a cell's point circles in a second, how fast the whole
    # field drifts across the screen in H per second, and how far a slow wave
    # bends the borders, in cells.
    churn: 0.03
    drift_h_s: 0.07
    wobble: 0.3
    # How thick the lit borders of the web are, and the fainter veins crossing
    # a cell, in cells.
    web_width: 0.07
    vein_width: 0.07
    # How far the ordered dither spreads one tone into the next.
    dither: 0.1
    # The four tones, darkest first: the heart of a cell, its body, the lighter
    # water towards its border, and the lit web itself. Hot in hue and dark in
    # value, so the flood never competes with the action; the light on it is
    # cold.
    depth_color: "#0F0514"
    cell_color: "#2A0E2B"
    crest_color: "#4A1F4A"
    foam_color: "#7FE6E8"
  # The droplet that falls where a button is hovered, selected with an arrow,
  # or clicked: the drop goes in, the surface flashes, and rings spread out of
  # the impact.
  ripple:
    # How far the rings reach from the spot the droplet lands on, in pixels,
    # and how long the whole splash takes.
    radius_px: 108
    duration_s: 0.8
    # How much of that the droplet spends falling in, before the impact.
    fall: 0.3
    # How many water pixels the splash is across, so it reads as pixel art at
    # any window size.
    pixels: 68
    # How thick a ring is, in ripple radii, and how long after one ring the
    # next is born, as a fraction of the spread.
    ring_width: 0.07
    ring_interval: 0.16
    # How far the ordered dither spreads one tone into the next.
    dither: 0.08
    # The two tones, and how much of the card below each one covers. Cold and
    # bright: the light on the flood, carried onto the menu.
    crest_color: "#3C93A6"
    crest_opacity: 0.4
    foam_color: "#A6F6F2"
    foam_opacity: 0.72

# The one font every word in the game is written in: menus, HUD, prologue,
# damage numbers, the debug editor. It must be monospace, since the prologue
# holds each character's place before it is typed.
font: fonts/Eirian-Regular.ttf

window:
  # maximized (a window filling the screen), borderless_fullscreen, or windowed.
  start_mode: maximized
  resizable_windowed: true
  music_volume_percent: 100
  sfx_volume_percent: 100

audio:
  footstep_interval_s: 0.42
  paused_music_volume_multiplier: 0.35
  room_clear_music_volume_multiplier: 0.55
  # How fast the music plays once a room is cleared, as a fraction of its
  # recorded speed: below 1 it drags, dropping in pitch as well as tempo.
  room_clear_music_speed: 0.8
  # How muffled the music sounds while the game is paused: 0 leaves it
  # untouched, 1 cuts the highs hardest, as if it played in another room.
  paused_music_muffle: 0.9
  # How muffled the music and the city are while a door is crossed, as if the
  # sound passed through the wall between two rooms.
  crossing_music_muffle: 0.55
  # Background music: one track is picked at random when a run starts and loops
  # until the run ends. Paths are under src/assets/; gain multiplies the music
  # volume setting.
  music_tracks:
    - { asset: audio/music/track_1.mp3, gain: 0.5 }
    - { asset: audio/music/track_2.mp3, gain: 0.5 }
    - { asset: audio/music/track_3.mp3, gain: 0.5 }
  # The opening music: it starts with the game, carries the main menu and the
  # opening room, and fades away over `intro_music_fade_out_s` as the run
  # crosses into room 1, where a chapter track takes over.
  intro_music: { asset: audio/music/intro.mp3, gain: 0.3 }
  intro_music_fade_out_s: 2.5
  # The city heard under everything, from the room a run opens in to its end:
  # a loop kept well below the rest, faded in over `ambience_fade_in_s`. Raise
  # its gain to hear more of the street, lower it to leave only a hum.
  ambience: { asset: audio/ambience/city.mp3, gain: 0.12 }
  ambience_fade_in_s: 2
  # Every sound effect is a recording: a cue listed here plays its file, and a
  # cue with no file here stays silent. Paths are under src/assets/; gain
  # multiplies the sound-effects volume setting.
  recorded_effects:
    door_open: { asset: audio/sfx/door-open.wav, gain: 0.3 }
    damage_neutral: { asset: audio/sfx/damage-neutral.wav, gain: 0.45 }
    damage_metal: { asset: audio/sfx/damage-metal.wav, gain: 0.45 }
    damage_metal_armor: { asset: audio/sfx/damage-metal-armor.wav, gain: 0.5 }
    bonus_chosen: { asset: audio/sfx/bonus-chosen.wav, gain: 0.22 }
    bonus_reroll: { asset: audio/sfx/bonus-reroll.wav, gain: 0.22 }
    # The chain's blows as they land on an enemy, in the chain's own order:
    # its first step plays the first, and so on. A blow past the end of the
    # list (a finisher, the charged blow, the slam) plays the last.
    punch_hits:
      - { asset: audio/sfx/punch-1.wav, gain: 0.4 }
      - { asset: audio/sfx/punch-2.wav, gain: 0.4 }
      - { asset: audio/sfx/punch-3.wav, gain: 0.45 }
    # A blow of the chain, or the charged one, that reached nobody.
    punch_missed: { asset: audio/sfx/punch-missed.wav, gain: 0.35 }
    # The player touching down, from a jump, a fall or a slam.
    land: { asset: audio/sfx/land.wav, gain: 0.2 }

controls:
  move_left: [KeyA, KeyQ, ArrowLeft]
  move_right: [KeyD, ArrowRight]
  move_down: [KeyS, ArrowDown]
  navigate_up: [ArrowUp]
  navigate_down: [ArrowDown]
  jump: [Space]
  attack: [KeyJ]
  cover: [KeyL]
  interact: [KeyE, Enter]
  pause: [Escape]
  toggle_fullscreen: [KeyF]
  choose_first_bonus: [Digit1, Numpad1]
  choose_second_bonus: [Digit2, Numpad2]
  reroll_bonus: [KeyR]
