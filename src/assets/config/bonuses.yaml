      uncommon: { unaware_damage_multiplier: 1.24 }
      rare: { unaware_damage_multiplier: 1.28 }
      epic: { unaware_damage_multiplier: 1.32 }
      legendary: { unaware_damage_multiplier: 1.4 }
  # Bonuses that change what a move does rather than how hard it hits: the
  # dash, the slam and the heavy blow each have one, and `requires` marks a
  # bonus that is only offered to a run owning the ones it names — what two of
  # them do together.
  - id: aftershock
    name: Aftershock
    description: A dash ends in a shock that hits everything beside you for {dash_shock_damage} damage.
    effects: { dash_shock_reach_h: 1.6 }
    rarities:
      rare: { dash_shock_damage: 18 }
      epic: { dash_shock_damage: 22 }
      legendary: { dash_shock_damage: 27 }
  - id: undertow
    name: Undertow
    description: The slam drags every enemy within {slam_pull_radius_h} H in to you.
    effects: { slam_pull_h_s: 10 }
    rarities:
      rare: { slam_pull_radius_h: 5 }
      epic: { slam_pull_radius_h: 6 }
      legendary: { slam_pull_radius_h: 7 }
