  - id: armor_piercing
    name: Armor Piercing
    description: A shot that breaks a shield still wounds the enemy behind it.
    category: combat
    effects: { shield_pierce: 1 }
  - id: executioner
    name: Executioner
    description: Deal 30% more damage to enemies below 30% health.
