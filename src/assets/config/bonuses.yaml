# Each category paints the bonus screen and names the item the player picks up
# on the ground once a room is cleared; the two bonuses offered then come from
# that item's category.
categories:
  combat:
    color: "#D74444"
    icon: crossed_swords
    pickup: pickups/combat.png
  defense:
    color: "#4F8FD6"
    icon: shield
    pickup: pickups/defense.png
  agility:
    color: "#58AD68"
    icon: wing
    pickup: pickups/agility.png
  intelligence:
    color: "#E6D772"
    icon: light
    pickup: pickups/intelligence.png
  combined:
    color: "#E8843F"
    icon: knot
    pickup: pickups/combined.png

# A bonus wears its rarity's colour, and nothing else's: white for common,
# green for uncommon, blue for rare, purple for epic and orange for legendary.
# The weight is how heavily a bonus of that rarity weighs in the draw against
# the others still on offer, so commons come up often and legendaries rarely.
rarities:
  common: { color: "#E4E4EE", weight: 40 }
  uncommon: { color: "#58AD68", weight: 25 }
  rare: { color: "#4F8FD6", weight: 12 }
  epic: { color: "#9A5FD0", weight: 5 }
  legendary: { color: "#E8843F", weight: 2 }

# Every category holds enough bonuses that a whole chapter of pickups, rerolls
# included, can never run it dry (`GameData::validate` checks it).
bonuses:
  - id: heavy_hands
    name: Heavy Hands
    description: Increase strike damage by 20%.
    category: combat
    rarity: uncommon
    effects: { strike_damage_multiplier: 1.2 }
