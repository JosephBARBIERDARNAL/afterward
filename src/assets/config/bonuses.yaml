  - id: rhythm_training
    name: Rhythm Training
    description: Blows landing within {hit_window_s} seconds of each other speed the chain by {combo_speed_step:%}, up to {combo_speed_max_bonus:%}.
    effects: { hit_window_s: 1.5 }
    rarities:
      uncommon: { combo_speed_step: 0.04, combo_speed_max_bonus: 0.16 }
      rare: { combo_speed_step: 0.05, combo_speed_max_bonus: 0.2 }
      epic: { combo_speed_step: 0.06, combo_speed_max_bonus: 0.24 }
      legendary: { combo_speed_step: 0.07, combo_speed_max_bonus: 0.28 }
  - id: chain_reaction
    name: Chain Reaction
    description: Killing an enemy increases damage by {kill_damage_bonus:%} for {kill_damage_duration_s} seconds.
    rarities:
      rare: { kill_damage_bonus: 0.15, kill_damage_duration_s: 2 }
      epic: { kill_damage_bonus: 0.2, kill_damage_duration_s: 2.5 }
