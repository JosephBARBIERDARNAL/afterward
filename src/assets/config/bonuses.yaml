# A bonus is drawn at one of its rarities, and wears that rarity's colour:
# white for common, green for uncommon, blue for rare, purple for epic and
# orange for legendary. Each version of a bonus at one rarity counts in the
# draw at that rarity's weight, against every version of every other bonus
# still on offer, so commons come up often and legendaries rarely.
rarities:
  common: { color: "#E4E4EE", weight: 40 }
  uncommon: { color: "#58AD68", weight: 25 }
  rare: { color: "#4F8FD6", weight: 12 }
  epic: { color: "#9A5FD0", weight: 5 }
  legendary: { color: "#E8843F", weight: 2 }

# A bonus that works with the build already owned weighs `weight_multiplier`
# times heavier in the draw, and the bonus screen names what it works with in
# `color` under its description. What counts:
# - `requires`: the bonuses it builds on (a combo, only offered once they are
#   all owned);
# - `synergies`: bonuses it works well with without needing them, either way
#   round (listing one on either side is enough);
# - Harmony's own count: `per_combo` grows with every owned combo.
synergy: { color: "#F2C14E", weight_multiplier: 3 }

# The words bonus descriptions lean on, each explained in a box at the bottom
# right of the bonus screen and the build window while a bonus using it is
# under the focus. `words` are what is looked for in a description: whole
# words, in lower case, any of them (list the plural too). Another bonus named
# in a description gets a box of its own, with its own description.
glossary:
  - term: Chain
    words: [chain, "chain's"]
    definition: Your melee combo. Each press of Attack throws its next blow.
  - term: Blow
    words: [blow, blows, strike]
    definition: One hit of the chain. It hurts everything its reach touches, so one blow can catch two enemies standing together.
  - term: Heavy blow
    words: [heavy blow, heavy blows]
    definition: Heavy Attack. Slow alone, and a heavier finisher after one or two blows of the chain. It goes through a shield, wounding the body behind it too.
  - term: Slam
    words: [slam]
    definition: Attack with Down held in mid-air drives you into the floor, which breaks to both sides of you.
  - term: Dash
    words: [dash, dashes, dashing, "dash's"]
    definition: A short burst on the ground or in mid-air. Nothing can touch you through most of it.
  - term: Airborne
    words: [airborne, mid-air]
    definition: Off the ground, jumping or falling. A mid-air jump is one taken before landing.
  - term: Wind-up
    words: [wind-up, wind-ups]
    definition: The moment an enemy warms up before it strikes.
  - term: Shield
    words: [shield, shields]
    definition: A layer of armor over an enemy's health bar. Each soaks one ordinary blow whole (a heavy blow goes through), and while one is up the enemy is never interrupted.
  - term: Health pickup
    words: [health pickup, health pickups, healing pickups]
    definition: A drop a dying enemy may leave, taken by walking over it. Healing is scarce inside a room.
  - term: Engaged
    words: [engaged]
    definition: An enemy that has seen you, or been woken by a blow, and is coming after you.
  - term: Unnoticed
    words: [noticed]
    definition: An enemy still standing idle. It sees far in front of it and only a little behind, and a blow nearby wakes it.
  - term: Double
    words: [double]
    definition: A standing copy of you. Enemies nearer to it than to you go after it, and what it takes costs you nothing.
  - term: Mark
    words: [marks, marked]
    definition: Marked Prey's reticle over an enemy you hit, while it lasts.
  - term: Combo
    words: [combo, combos]
    definition: A bonus that is what two others do together, offered only once you own both.

# Every bonus here is read by the game: one that nothing reads is taken out
# rather than left to thin the draw.
#
# `rarities` lists the versions a bonus is drawn at, each with the effects it
# has on top of (or in place of) the shared `effects`: the rarer version of a
# bonus does more of the same. Where a bigger number would mean nothing (a
# move added, a once-a-room shield) the bonus comes at one rarity only. The
# rarest a bonus starts at follows what it does: a plain number is common, one
# with a condition uncommon, one that changes what a move does rare, and the
# few a run is built around epic or legendary.
#
# `description` writes the version's numbers in: `{effect}` as it is,
# `{effect:%}` as a share (0.04 is 4%), `{effect:+%}` as what a multiplier
# adds (1.2 is 20%), `{effect:-%}` as what it takes away (0.9 is 10%). Another
# bonus named in a description is written in bold.
#
# Fire Kick, Power Strike and Explosive Strike are the rival heavy finishers:
# each is a step of `player.melee.heavy` in `config/gameplay.yaml` that only a
# run owning it throws, in place of the heavy blow after two of the chain, and
# a run holding more than one throws the last of them listed there.
#
# `family` names what a bonus raises when another bonus raises the same: two
# bonuses of one family are never offered side by side, so a choice never
# sets one beside a plainly better version of itself.
bonuses:
  - id: heavy_hands
    name: Heavy Hands
    description: Increase strike damage by {strike_damage_multiplier:+%}.
    family: strike_damage
    rarities:
      common: { strike_damage_multiplier: 1.2 }
      uncommon: { strike_damage_multiplier: 1.24 }
      rare: { strike_damage_multiplier: 1.28 }
      epic: { strike_damage_multiplier: 1.32 }
      legendary: { strike_damage_multiplier: 1.4 }
  - id: finisher
    name: Finisher
    description: The chain's last blow deals {finisher_damage_multiplier:+%} more damage.
    rarities:
      uncommon: { finisher_damage_multiplier: 1.5 }
      rare: { finisher_damage_multiplier: 1.6 }
      epic: { finisher_damage_multiplier: 1.7 }
      legendary: { finisher_damage_multiplier: 1.9 }
  - id: quick_hands
    name: Quick Hands
    description: The chain throws its blows {combo_speed_multiplier:+%} faster.
    rarities:
      common: { combo_speed_multiplier: 1.15 }
      uncommon: { combo_speed_multiplier: 1.18 }
      rare: { combo_speed_multiplier: 1.21 }
      epic: { combo_speed_multiplier: 1.24 }
      legendary: { combo_speed_multiplier: 1.3 }
  - id: long_reach
    name: Long Reach
    description: Blows reach {strike_reach_multiplier:+%} further.
    rarities:
      uncommon: { strike_reach_multiplier: 1.25 }
      rare: { strike_reach_multiplier: 1.3 }
      epic: { strike_reach_multiplier: 1.35 }
      legendary: { strike_reach_multiplier: 1.45 }
  - id: fire_kick
    name: Fire Kick
    description: The heavy blow after two of the chain becomes a blazing kick, dealing 62 damage.
    effects: { adds_combo_step: 1 }
    rarities: { epic: {} }
  - id: power_strike
    name: Power Strike
    description: The heavy blow after two of the chain becomes a crushing strike, dealing 55 damage.
    effects: { adds_combo_step: 1 }
    rarities: { rare: {} }
  - id: explosive_strike
    name: Explosive Strike
    description: The heavy blow after two of the chain becomes a blast that hits every side at once, dealing 45 damage.
    effects: { adds_combo_step: 1 }
    rarities: { epic: {} }
  - id: thick_skin
    name: Thick Skin
    description: Reduce damage taken by {damage_taken_multiplier:-%}.
    family: damage_taken
    rarities:
      common: { damage_taken_multiplier: 0.9 }
      uncommon: { damage_taken_multiplier: 0.88 }
      rare: { damage_taken_multiplier: 0.86 }
      epic: { damage_taken_multiplier: 0.84 }
      legendary: { damage_taken_multiplier: 0.8 }
  - id: room_ward
    name: Room Ward
    description: Negate the first damage event in each room.
    effects: { negate_first_damage_each_room: 1 }
    rarities: { epic: {} }
  - id: scavenger
    name: Scavenger
    description: Increase health pickup drop chance by {health_drop_chance_multiplier:+%}.
    rarities:
      common: { health_drop_chance_multiplier: 1.25 }
      uncommon: { health_drop_chance_multiplier: 1.3 }
      rare: { health_drop_chance_multiplier: 1.35 }
      epic: { health_drop_chance_multiplier: 1.4 }
      legendary: { health_drop_chance_multiplier: 1.5 }
  - id: fleet_feet
    name: Fleet Feet
    description: Increase movement speed by {movement_speed_multiplier:+%}.
    rarities:
      common: { movement_speed_multiplier: 1.1 }
      uncommon: { movement_speed_multiplier: 1.12 }
      rare: { movement_speed_multiplier: 1.14 }
      epic: { movement_speed_multiplier: 1.16 }
      legendary: { movement_speed_multiplier: 1.2 }
  - id: high_jump
    name: High Jump
    description: Increase jump height by {jump_height_multiplier:+%}.
    rarities:
      common: { jump_height_multiplier: 1.15 }
      uncommon: { jump_height_multiplier: 1.18 }
      rare: { jump_height_multiplier: 1.21 }
      epic: { jump_height_multiplier: 1.24 }
      legendary: { jump_height_multiplier: 1.3 }
  # Kick Off makes the mid-air jump whole, so even the legendary Double Jump
  # stays short of it.
  - id: double_jump
    name: Double Jump
    description: Gain one additional mid-air jump at {extra_jump_impulse_factor:%} of normal jump impulse.
    effects: { extra_midair_jumps: 1 }
