        }
      rare:
        {
          healing_pickup_combo_speed_multiplier: 1.21,
          healing_pickup_combo_speed_duration_s: 4,
        }
      epic:
        {
          healing_pickup_combo_speed_multiplier: 1.24,
          healing_pickup_combo_speed_duration_s: 4.5,
        }
      legendary:
        {
          healing_pickup_combo_speed_multiplier: 1.3,
