# Each category paints the bonus screen and the glow of the item the player
# picks up once a room is cleared; the two bonuses offered then come from that
# item's category.
categories:
  combat:
    color: "#D74444"
    icon: crossed_swords
  defense:
    color: "#4F8FD6"
    icon: shield
  agility:
    color: "#58AD68"
    icon: wing
  intelligence:
    color: "#E6D772"
    icon: light
  combined:
    color: "#E8843F"
    icon: knot

# A bonus wears its rarity's colour, and nothing else's: white for common,
# green for uncommon, blue for rare, purple for epic and orange for legendary.
# The weight is how heavily a bonus of that rarity weighs in the draw against
# the others still on offer, so commons come up often and legendaries rarely.
rarities:
  common: { color: "#E4E4EE", weight: 40 }
  uncommon: { color: "#58AD68", weight: 25 }
  rare: { color: "#4F8FD6", weight: 12 }
  epic: { color: "#9A5FD0", weight: 5 }
  legendary: { color: "#E8843F", weight: 2 }

# Every bonus here is read by the game: one that nothing reads is taken out
# rather than left to thin the draw. Rarity follows what a bonus does: a plain
# number is common, one with a condition uncommon, one that changes what a
# move does rare, and the few a run is built around epic or legendary.
#
# Fire Kick, Power Strike and Explosive Strike are the melee chain's rival
# finishers: each is a step of `player.melee` in `config/gameplay.yaml` that
# only a run owning it throws, and a run holding more than one throws the last
# of them listed there rather than all of them.
bonuses:
  - id: heavy_hands
    name: Heavy Hands
    description: Increase strike damage by 20%.
    category: combat
    rarity: common
    effects: { strike_damage_multiplier: 1.2 }
  - id: finisher
    name: Finisher
    description: The chain's last blow deals 50% more damage.
    category: combat
    rarity: uncommon
    effects: { finisher_damage_multiplier: 1.5 }
  - id: quick_hands
    name: Quick Hands
    description: The chain throws its blows 15% faster.
    category: combat
    rarity: common
    effects: { combo_speed_multiplier: 1.15 }
  - id: long_reach
    name: Long Reach
    description: Blows reach 25% further.
    category: combat
    rarity: uncommon
    effects: { strike_reach_multiplier: 1.25 }
  - id: fire_kick
    name: Fire Kick
    description: Adds a blazing fourth blow to the chain, dealing 45 damage.
    category: combat
    rarity: epic
    effects: { adds_combo_step: 1 }
  - id: power_strike
    name: Power Strike
    description: Ends the chain with a heavier blow, dealing 38 damage.
    category: combat
    rarity: rare
    effects: { adds_combo_step: 1 }
  - id: explosive_strike
    name: Explosive Strike
    description: Ends the chain with a blast that hits every side at once, dealing 30 damage.
    category: combat
    rarity: epic
    effects: { adds_combo_step: 1 }
  - id: thick_skin
    name: Thick Skin
    description: Reduce damage taken by 10%.
    category: defense
    rarity: common
    effects: { damage_taken_multiplier: 0.9 }
  - id: room_ward
    name: Room Ward
    description: Negate the first damage event in each room.
    category: defense
    rarity: epic
    effects: { negate_first_damage_each_room: true }
  - id: vitality
    name: Vitality
    description: Increase maximum health by 15 and restore 15 health.
    category: defense
    rarity: uncommon
    effects: { max_health_increase: 15, restore_health: 15 }
  - id: scavenger
    name: Scavenger
    description: Increase health pickup drop chance by 25%.
    category: defense
    rarity: common
    effects: { health_drop_chance_multiplier: 1.25 }
  - id: fleet_feet
    name: Fleet Feet
    description: Increase movement speed by 10%.
    category: agility
    rarity: common
    effects: { movement_speed_multiplier: 1.1 }
  - id: high_jump
    name: High Jump
    description: Increase jump height by 15%.
    category: agility
    rarity: common
    effects: { jump_height_multiplier: 1.15 }
  - id: double_jump
    name: Double Jump
    description: Gain one additional mid-air jump at 80% of normal jump impulse.
    category: agility
    rarity: epic
    effects: { extra_midair_jumps: 1, extra_jump_impulse_factor: 0.8 }
  - id: marked_prey
    name: Marked Prey
    description: A blow marks an enemy for 2 seconds; further blows on it deal 15% more damage.
    category: intelligence
    rarity: uncommon
    effects: { mark_duration_s: 2, marked_strike_damage_multiplier: 1.15 }
  - id: rhythm_training
    name: Rhythm Training
    description: Blows landing within 1.5 seconds of each other speed the chain by 4%, up to 16%.
    category: intelligence
    rarity: uncommon
    effects:
      { hit_window_s: 1.5, combo_speed_step: 0.04, combo_speed_max_bonus: 0.16 }
  - id: chain_reaction
    name: Chain Reaction
    description: Killing an enemy increases damage by 15% for 2 seconds.
    category: intelligence
    rarity: rare
    effects: { kill_damage_bonus: 0.15, kill_damage_duration_s: 2 }
  - id: deep_breath
    name: Deep Breath
    description: The window to chain the next blow lasts 30% longer.
    category: intelligence
    rarity: common
    effects: { combo_window_multiplier: 1.3 }
  - id: lifesteal
    name: Lifesteal
    description: Landing a blow restores 1 health, up to 5 health per room.
    category: combined
    rarity: legendary
    effects: { strike_hit_healing: 1, room_healing_cap: 5 }
  - id: aerial_assault
    name: Aerial Assault
    description: Deal 20% more strike damage while airborne.
    category: combined
    rarity: uncommon
    effects: { airborne_strike_damage_multiplier: 1.2 }
  - id: sated_fury
    name: Sated Fury
    description: Healing pickups speed the chain by 15% for 3 seconds.
    category: combined
    rarity: common
    effects:
      {
        healing_pickup_combo_speed_multiplier: 1.15,
        healing_pickup_combo_speed_duration_s: 3,
      }

  - id: shield_breaker
    name: Shield Breaker
    description: A blow that breaks a shield still wounds the enemy behind it.
    category: combat
    rarity: rare
    effects: { shield_pierce: 1 }
  - id: executioner
    name: Executioner
    description: Deal 30% more damage to enemies below 30% health.
    category: combat
    rarity: uncommon
    effects: { execute_health_fraction: 0.3, execute_damage_multiplier: 1.3 }
  - id: bulwark
    name: Bulwark
    description: Taking cover reduces damage by a further 15%.
    category: defense
    rarity: uncommon
    effects: { cover_damage_taken_multiplier: 0.85 }
  - id: steadfast
    name: Steadfast
    description: Increase maximum health by 10.
    category: defense
    rarity: common
    effects: { max_health_increase: 10 }
  - id: field_dressing
    name: Field Dressing
    description: Health pickups restore 50% more.
    category: defense
    rarity: common
    effects: { health_pickup_multiplier: 1.5 }
  - id: adrenaline
    name: Adrenaline
    description: Below 30% health, reduce damage taken by 20%.
    category: defense
    rarity: uncommon
    effects:
      { low_health_fraction: 0.3, low_health_damage_taken_multiplier: 0.8 }
  - id: deflector
    name: Deflector
    description: Negate the first projectile that would hit you in each room.
    category: defense
    rarity: rare
    effects: { negate_first_projectile_each_room: 1 }
  - id: recovery
    name: Recovery
    description: Restore 1 health per second while no enemy is engaged.
    category: defense
    rarity: epic
    effects: { idle_regeneration_per_s: 1 }
  - id: last_stand
    name: Last Stand
    description: Once per run, survive an otherwise fatal hit at 1 health.
    category: defense
    rarity: legendary
    effects: { survive_fatal_hits: 1 }
  - id: kick_off
    name: Kick Off
    description: A mid-air jump is as strong as one from the ground.
    category: agility
    rarity: rare
    requires: [double_jump]
    effects: { extra_jump_impulse_factor: 1 }
  - id: decoy
    name: Decoy
    description: Rolling leaves a double of you behind for enemies to swing at.
    category: agility
    rarity: rare
    effects: { decoy_health: 30 }
  - id: cold_read
    name: Cold Read
    description: Enemy wind-ups last 10% longer.
    category: intelligence
    rarity: common
    effects: { enemy_windup_multiplier: 1.1 }
  - id: foresight
    name: Foresight
    description: Gain one extra reroll.
    category: intelligence
    rarity: epic
    effects: { extra_rerolls: 1 }
  - id: opportunist
    name: Opportunist
    description: Deal 20% more damage to enemies that have not noticed you.
    category: combined
    rarity: common
    effects: { unaware_damage_multiplier: 1.2 }
  # Bonuses that change what a move does rather than how hard it hits: the
  # roll, the slam and the charged blow each have one, and `requires` marks a
  # bonus that is only offered to a run owning the ones it names — what two of
  # them do together.
  - id: aftershock
    name: Aftershock
    description: A roll ends in a shock that hits everything beside you for 18 damage.
    category: agility
    rarity: rare
    effects: { roll_shock_damage: 18, roll_shock_reach_h: 1.6 }
  - id: undertow
    name: Undertow
    description: The slam drags every enemy within 5 H in to you.
    category: combat
    rarity: rare
    effects: { slam_pull_radius_h: 5, slam_pull_h_s: 10 }
  - id: battering_ram
    name: Battering Ram
    description: The charged blow throws what it hits into whatever stands behind, for 25 damage.
    category: combat
    rarity: rare
    effects:
      {
        launch_damage: 25,
        launch_reach_h: 3,
        launch_knockback_multiplier: 2.5,
      }
  - id: riptide
    name: Riptide
    description: "Aftershock and Undertow together: the roll's shock drags enemies in too."
    category: combined
    rarity: rare
    requires: [aftershock, undertow]
    effects: {}
  - id: breaker
    name: Breaker
    description: "Undertow and Battering Ram together: the slam goes through shields."
    category: combined
    rarity: rare
    requires: [undertow, battering_ram]
    effects: {}
