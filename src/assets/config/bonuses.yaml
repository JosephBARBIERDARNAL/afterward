categories:
  combat:
    color: "#D74444"
    icon: crossed_swords
  defense:
    color: "#4F8FD6"
    icon: shield
  agility:
    color: "#58AD68"
    icon: wing
  intelligence:
    color: "#E6D772"
    icon: light
  combined:
    color: "#E8843F"
    icon: knot

bonuses:
  - id: hollow_points
    name: Hollow Points
    description: Increase bullet damage by 20%.
    category: combat
    effects: { bullet_damage_multiplier: 1.2 }
  - id: last_round
    name: Last Round
    description: The last bullet of each magazine deals 50% more damage.
    category: combat
    effects: { last_round_damage_multiplier: 1.5 }
  - id: hair_trigger
    name: Hair Trigger
    description: Increase fire rate by 15%.
    category: combat
    effects: { fire_rate_multiplier: 1.15 }
  - id: extended_magazine
    name: Extended Magazine
    description: Increase magazine size by 4 rounds.
    category: combat
    effects: { extra_magazine_rounds: 4 }
  - id: thick_skin
    name: Thick Skin
    description: Reduce damage taken by 10%.
    category: defense
    effects: { damage_taken_multiplier: 0.9 }
  - id: room_ward
    name: Room Ward
    description: Negate the first damage event in each room.
    category: defense
    effects: { negate_first_damage_each_room: true }
  - id: vitality
    name: Vitality
    description: Increase maximum health by 15 and restore 15 health.
    category: defense
    effects: { max_health_increase: 15, restore_health: 15 }
  - id: scavenger
    name: Scavenger
    description: Increase health pickup drop chance by 25% relative to its base chance.
    category: defense
    effects: { health_drop_chance_multiplier: 1.25 }
  - id: fleet_feet
    name: Fleet Feet
    description: Increase movement speed by 10%.
    category: agility
    effects: { movement_speed_multiplier: 1.1 }
  - id: high_jump
    name: High Jump
    description: Increase jump height by 15%.
    category: agility
    effects: { jump_height_multiplier: 1.15 }
  - id: dash_recharge
    name: Dash Recharge
    description: Reduce dash cooldown by 20%.
    category: agility
    effects: { dash_cooldown_multiplier: 0.8 }
  - id: double_jump
    name: Double Jump
    description: Gain one additional mid-air jump at 80% of normal jump impulse.
    category: agility
    effects: { extra_midair_jumps: 1, extra_jump_impulse_factor: 0.8 }
  - id: sprinter
    name: Sprinter
    description: After a grounded dash, keep sprinting at 8.5 H/s until you stop or turn.
    category: agility
    effects: { sprint_speed_h_s: 8.5 }
  - id: marked_prey
    name: Marked Prey
    description: Bullet hits mark an enemy for 2 seconds; further bullets on it deal 15% more damage.
    category: intelligence
    effects: { mark_duration_s: 2, marked_bullet_damage_multiplier: 1.15 }
  - id: rhythm_training
    name: Rhythm Training
    description: Hits within 1.5 seconds increase fire rate by 4%, up to 16%.
    category: intelligence
    effects: { hit_window_s: 1.5, fire_rate_step: 0.04, fire_rate_max_bonus: 0.16 }
  - id: chain_reaction
    name: Chain Reaction
    description: Killing an enemy increases damage by 15% for 2 seconds.
    category: intelligence
    effects: { kill_damage_bonus: 0.15, kill_damage_duration_s: 2 }
  - id: speed_loader
    name: Speed Loader
    description: Reload 30% faster.
    category: intelligence
    effects: { reload_speed_multiplier: 1.3 }
  - id: vampiric_rounds
    name: Vampiric Rounds
    description: Bullet hits restore 1 health, up to 5 health per magazine.
    category: combined
    effects: { bullet_hit_healing: 1, magazine_healing_cap: 5 }
  - id: dash_shot
    name: Dash Shot
    description: The first shot within 1 second after dashing deals 25% more damage.
    category: combined
    effects: { post_dash_window_s: 1, post_dash_bullet_damage_multiplier: 1.25 }
  - id: aerial_gunner
    name: Aerial Gunner
    description: Deal 20% more bullet damage while airborne.
    category: combined
    effects: { airborne_bullet_damage_multiplier: 1.2 }
  - id: sated_fury
    name: Sated Fury
    description: Healing pickups increase fire rate by 15% for 3 seconds.
    category: combined
    effects: { healing_pickup_fire_rate_multiplier: 1.15, healing_pickup_fire_rate_duration_s: 3 }
