  - id: field_dressing
    name: Field Dressing
    description: Health pickups restore 50% more.
    category: defense
    effects: { health_pickup_multiplier: 1.5 }
  - id: adrenaline
    name: Adrenaline
    description: Below 30% health, reduce damage taken by 20%.
    category: defense
    effects: { low_health_fraction: 0.3, low_health_damage_taken_multiplier: 0.8 }
  - id: deflector
    name: Deflector
    description: Negate the first projectile that would hit you in each room.
    category: defense
    effects: { negate_first_projectile_each_room: 1 }
  - id: thick_plating
