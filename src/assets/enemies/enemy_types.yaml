# Shared Chapter 1 tuning defaults. Room enemy_spawns reference these type IDs;
# any future room-specific stat changes belong on that room's spawn entry.
# What an idle enemy sees. It stands idle until the player comes into sight,
# which takes all three: no further than range_h away, no more than height_h
# above or below its eyes (both measured between the two hurtbox centers), and
# on the side it faces, with no platform standing between them. Which side it
# faces is the `facing` of its room spawn: left, the way the player walks in
# from, unless that room turns it right. Being shot wakes it whatever it can
# see. Once it has seen the player, retain_target keeps it chasing even out of
# sight; without it, losing sight sends it back to idle.
detection:
  range_h: 10
  height_h: 3
  retain_target: true
damage_triggers_combat: true
# Shared enemy jumping. Engaged enemies jump to reach the player's level (a
# higher platform, or across a gap at their own level) only when a platform is
# reachable within jump_height_h and air_speed_h_s; they walk off ledges to
# drop down. The player counts as on another level once their grounded feet
# differ from the enemy's by more than level_change_threshold_h. Each type may
# override jump_height_h.
jumping:
  jump_height_h: 2.25
  air_speed_h_s: 5
  cooldown_s: 0.6
  level_change_threshold_h: 1
# Hitboxes, in H (F3 in debug builds draws them all over the game):
# - hurtbox_h: where bullets hit the enemy, centered on it, from its feet up.
# - an attack's hitbox_h: where its strike (or a slam's landing) hurts the
#   player, from the enemy's feet; x points the way the enemy faces (negative
#   reaches behind it), y up. The enemy starts the attack once the player's
#   hurtbox reaches the box's far edge.
# - a projectile attack's projectile_size_h: the shot's size.
# material picks the sound a hit on the enemy makes; metal enemies also
# carry a shield that soaks their first hit. Nothing here is alive: the cast
# is the machines the drowned city never switched off, so the materials are
# an armoured chassis (metal) and a light frame (polymer). The sprite sheets
# they currently wear are placeholders from a fantasy pack and do not match
# these names yet; see art/README.md.
types:
  blade_unit:
    hurtbox_h: { width: 0.6, height: 1 }
    health: 30
    material: metal
    movement_speed_h_s: 2.5
    behavior: melee_pursuit
    procedural_movement:
      bob_height_h: 0.06
      cycles_per_h: 1
      lean_degrees: 3
    attack:
      kind: melee
      damage: 8
      hitbox_h: { x: -0.3, y: 0, width: 0.8, height: 0.95 }
      cooldown_s: 1.2
      windup_s: 0.35
  rifle_unit:
    hurtbox_h: { width: 0.6, height: 1 }
    health: 24
    material: metal
    movement_speed_h_s: 1.5
    behavior: ranged_keep_distance
    preferred_distance_h: { min: 5, max: 8 }
    attack:
      kind: projectile
      damage: 8
      projectile_size_h: { width: 0.3, height: 0.17 }
      projectile_speed_h_s: 8
      cooldown_s: 1.5
      windup_s: 0.4
  heavy_unit:
    hurtbox_h: { width: 0.6, height: 1 }
    health: 45
    material: metal
    movement_speed_h_s: 0.8
    behavior: ranged_keep_distance
    preferred_distance_h: { min: 6, max: 10 }
    attack:
      kind: charged_projectile
      damage: 14
      projectile_size_h: { width: 0.3, height: 0.17 }
      projectile_speed_h_s: 7
      cooldown_s: 2.2
      windup_s: 0.7
  stalker_unit:
    hurtbox_h: { width: 0.6, height: 1 }
    health: 28
    material: polymer
    movement_speed_h_s: 3.5
    behavior: melee_pursuit
    attack:
      kind: lunge
      damage: 8
      hitbox_h: { x: 0, y: 0, width: 1, height: 1.5 }
      cooldown_s: 1.4
      windup_s: 0.3
  lancer_unit:
    hurtbox_h: { width: 0.6, height: 1 }
    health: 36
    material: polymer
    movement_speed_h_s: 2.3
    behavior: ranged_keep_distance
    preferred_distance_h: { min: 5, max: 8 }
    attack:
      kind: special_projectile
      damage: 10
      projectile_size_h: { width: 0.3, height: 0.17 }
      projectile_speed_h_s: 7
      cooldown_s: 2
      windup_s: 0.5
  breaker_unit:
    hurtbox_h: { width: 0.6, height: 1 }
    health: 46
    material: polymer
    movement_speed_h_s: 2.2
    behavior: melee_pursuit
    attack:
      kind: heavy_melee_sweep
      damage: 12
      hitbox_h: { x: 0, y: 0, width: 1.3, height: 1.5 }
      cooldown_s: 1.8
      windup_s: 0.55
  # Fast, fragile melee: dashes in and slashes before others can react.
  scout_unit:
    hurtbox_h: { width: 0.6, height: 1 }
    health: 26
    material: polymer
    movement_speed_h_s: 4
    behavior: melee_pursuit
    attack:
      kind: lunge
      damage: 9
      hitbox_h: { x: -0.1, y: 0, width: 0.6, height: 0.95 }
      cooldown_s: 1.3
      windup_s: 0.25
  emitter_unit:
    hurtbox_h: { width: 0.6, height: 2.6 }
    health: 300
    material: polymer
    movement_speed_h_s: 3
    jump_height_h: 2.75
    behavior: boss
    attacks:
      - kind: two_hit_melee_combo
        hits: 2
        damage_per_hit: 10
        hitbox_h: { x: 0, y: 0, width: 1.2, height: 1.5 }
        cooldown_s: 1.4
        windup_s: 0.45
      - kind: telegraphed_lunge
        damage: 15
        hitbox_h: { x: 0, y: 0, width: 0.9, height: 1.5 }
        cooldown_s: 1.9
        windup_s: 0.6
      # Wind-up is the crouch before take-off; damage lands on touchdown.
      - kind: jump_slam
        damage: 18
        hitbox_h: { x: -2, y: -2, width: 4, height: 4 }
        cooldown_s: 2.5
        windup_s: 0.8
    phase_two:
      health_fraction_at_or_below: 0.5
      cooldown_multiplier: 0.8
