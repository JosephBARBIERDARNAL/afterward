# Shared Chapter 1 tuning defaults. Room enemy_spawns reference these type IDs;
# any future room-specific stat changes belong on that room's spawn entry.
# What an idle enemy notices. It stands idle until the player comes into
# sight, which takes all of: no more than height_h above or below its eyes
# (measured between the two hurtbox centers), no platform standing between
# them, and no further than range_h away on the side it faces, or
# behind_range_h away at its back. Which side it faces is the `facing` of its
# room spawn: left, the way the player walks in from, unless that room turns
# it right. A blow wakes the enemy it lands on whatever it can see, and is
# heard by every idle enemy within hearing_range_h of the one it landed on,
# walls or not. Once it has noticed the player, retain_target keeps it chasing
# even out of sight; without it, losing sight sends it back to idle.
detection:
  range_h: 10
  behind_range_h: 3
  height_h: 3
  hearing_range_h: 8
  retain_target: true
damage_triggers_combat: true
# Shared enemy jumping. Engaged enemies jump to reach the player's level (a
# higher platform, or across a gap at their own level) only when a platform is
# reachable within jump_height_h and air_speed_h_s. The player counts as on
# another level once their grounded feet differ from the enemy's by more than
# level_change_threshold_h. Each type may override jump_height_h.
# An enemy keeps to the floor it stands on: it stops at a ledge rather than
# walk off it. It only steps off on its way to a player standing below, when
# the floor under the ledge is no more than max_drop_h down and no lower than
# the player's own level, so it never ends up beneath them. Backing away from
# the player never takes it off a ledge.
jumping:
  jump_height_h: 2.25
  air_speed_h_s: 5
  cooldown_s: 0.6
  level_change_threshold_h: 1
  max_drop_h: 5
# Hitboxes, in H (B in debug builds draws them all over the game):
# - hurtbox_h: where bullets hit the enemy, centered on it, from its feet up.
# - an attack's hitbox_h: where its strike (or a slam's landing) hurts the
#   player, from the enemy's feet; x points the way the enemy faces (negative
#   reaches behind it), y up. The enemy starts the attack once the player's
#   hurtbox reaches the box's far edge.
# - a projectile attack's projectile_size_h: the shot's size.
# material picks the sound a hit on the enemy's body makes. No type walks in
# armored: armor is given to one enemy at a time, by `armor_layers` on its
# room spawn. Each layer soaks one ordinary blow whole, and while any is left
# a hit does not interrupt the enemy, even the charged blow that wounds it
# through the armor. Health, speed and damage are the type's alone: every
# enemy of a type has the same. Nothing here is alive: the cast is the
# machines the drowned city never switched off, so the materials are an
# armoured chassis (metal) and a light frame (polymer). The sprite sheets
# they currently wear are placeholders from a fantasy pack and do not match
# these names yet
# A ranged_keep_distance type closes in to the far end of its
# preferred_distance_h and fires as soon as its shot is ready, however close
# the player stands. It only backs away, toward the near end, while the shot
# cools down.
# An attack may name the `clip` it plays (the sheet `<type>_<clip>`) and the
# `strike_frame` of it the blow lands on: the frames before that one are then
# spread over windup_s, so the telegraph ends exactly as it hits, and the
# frames after it are played out before the enemy moves again — its
# follow-through is the opening it leaves.
types:
  blade_unit:
    hurtbox_h: { width: 0.8, height: 0.9 }
    # Fodder: the chain's first two blows (18 and 20) put it down, so a
    # crowd of them is what makes the player feel strong.
    health: 36
    material: metal
    movement_speed_h_s: 2.5
    behavior: melee_pursuit
    procedural_movement:
      bob_height_h: 0.06
      cycles_per_h: 1
      lean_degrees: 3
    # From a couple of H away it winds up longer and darts in behind its
    # blade: stepped back from, or rolled through. Up close it just slashes.
    attacks:
      - kind: lunge
        damage: 10
        hitbox_h: { x: -0.3, y: 0, width: 0.8, height: 0.95 }
        start_range_h: 1.9
        min_range_h: 1.2
        cooldown_s: 1.6
        windup_s: 0.5
      - kind: melee
        damage: 8
        hitbox_h: { x: -0.3, y: 0, width: 0.8, height: 0.95 }
        cooldown_s: 1.2
        windup_s: 0.35
  rifle_unit:
    hurtbox_h: { width: 0.6, height: 1 }
    # The shooter: frail once reached, three blows of the chain.
    health: 60
    material: metal
    movement_speed_h_s: 1.5
    behavior: ranged_keep_distance
    preferred_distance_h: { min: 5, max: 8 }
    attack:
      kind: projectile
      damage: 8
      projectile_size_h: { width: 0.3, height: 0.17 }
      projectile_speed_h_s: 8
      cooldown_s: 1.5
      windup_s: 0.4
  heavy_unit:
    hurtbox_h: { width: 0.6, height: 1 }
    # The tough one of a wave: two full chains, or a charged blow and one.
    health: 140
    material: metal
    movement_speed_h_s: 0.8
    behavior: ranged_keep_distance
    preferred_distance_h: { min: 6, max: 10 }
    attack:
      kind: charged_projectile
      damage: 14
      projectile_size_h: { width: 0.3, height: 0.17 }
      projectile_speed_h_s: 7
      cooldown_s: 2.2
      windup_s: 0.7
  # The dark robots: the three chassis above, rebuilt heavier. Each takes
  # more, hits harder, moves faster and winds up sooner than the one it is
  # drawn from, and their sheets are those robots' recoloured
  # (scripts/darken_robots.py). They are meant to be met one or two to a room,
  # under a few layers of armor given by their room spawn.
  dark_blade_unit:
    hurtbox_h: { width: 0.8, height: 0.9 }
    health: 250
    material: metal
    movement_speed_h_s: 3.2
    behavior: melee_pursuit
    procedural_movement:
      bob_height_h: 0.06
      cycles_per_h: 1
      lean_degrees: 3
    # The elite does not walk up: from across the floor it leaps at where
    # the player stands and comes down blade first. Roll under it, or be
    # somewhere else when it lands; up close it slashes, faster than the
    # plain blade does.
    attacks:
      - kind: jump_slam
        damage: 16
        hitbox_h: { x: -0.6, y: 0, width: 1.2, height: 0.95 }
        start_range_h: 4.5
        min_range_h: 2.2
        cooldown_s: 1.8
        windup_s: 0.5
      - kind: melee
        damage: 14
        hitbox_h: { x: -0.3, y: 0, width: 0.8, height: 0.95 }
        cooldown_s: 0.9
        windup_s: 0.3
  dark_rifle_unit:
    hurtbox_h: { width: 0.6, height: 1 }
    health: 250
    material: metal
    movement_speed_h_s: 2
    behavior: ranged_keep_distance
    preferred_distance_h: { min: 5, max: 8 }
    attack:
      kind: projectile
      damage: 12
      projectile_size_h: { width: 0.3, height: 0.17 }
      projectile_speed_h_s: 10
      cooldown_s: 1.1
      windup_s: 0.35
  dark_heavy_unit:
    hurtbox_h: { width: 0.6, height: 1 }
    health: 250
    material: metal
    movement_speed_h_s: 1.1
    behavior: ranged_keep_distance
    preferred_distance_h: { min: 6, max: 10 }
    attack:
      kind: charged_projectile
      damage: 20
      projectile_size_h: { width: 0.3, height: 0.17 }
      projectile_speed_h_s: 9
      cooldown_s: 1.8
      windup_s: 0.6
  emitter_unit:
    hurtbox_h: { width: 0.6, height: 2.6 }
    health: 300
    material: polymer
    movement_speed_h_s: 3
    jump_height_h: 2.75
    behavior: boss
    attacks:
      - kind: two_hit_melee_combo
        hits: 2
        damage_per_hit: 10
        hitbox_h: { x: 0, y: 0, width: 1.2, height: 1.5 }
        cooldown_s: 1.4
        windup_s: 0.45
      - kind: telegraphed_lunge
        damage: 15
        hitbox_h: { x: 0, y: 0, width: 0.9, height: 1.5 }
        cooldown_s: 1.9
        windup_s: 0.6
      # Wind-up is the crouch before take-off; damage lands on touchdown.
      - kind: jump_slam
        damage: 18
        hitbox_h: { x: -2, y: -2, width: 4, height: 4 }
        cooldown_s: 2.5
        windup_s: 0.8
    phase_two:
      health_fraction_at_or_below: 0.5
      cooldown_multiplier: 0.8
  # The Black Knight: a second boss, drawn from its own pack
  # (enemies/black_knight/, cut by scripts/slice_black_knight.py) and placed
  # in no room yet. It stands unarmed until it notices the player, draws, and
  # then works through its attacks in order. Its body is 31 px tall in a
  # sheet drawn at 3 world units a pixel, which is where 1.9 H comes from.
  black_knight:
    hurtbox_h: { width: 1, height: 1.5 }
    health: 450
    material: metal
    movement_speed_h_s: 3.2
    jump_height_h: 2.75
    behavior: boss
    attacks:
      # Two swings out of one clip: the second comes out of the follow-through
      # of the first.
      - kind: two_hit_melee_combo
        clip: combo
        strike_frame: 9
        hits: 2
        damage_per_hit: 10
        hitbox_h: { x: -0.4, y: 0, width: 2.6, height: 2.4 }
        cooldown_s: 1.6
        windup_s: 0.5
      # windup_s raises the guard, and a blow still lands while it comes up.
      # Once up it is held for hold_s: an ordinary blow on it costs the knight
      # nothing and is answered, counter_windup_s later, with this attack's
      # damage over this hitbox — the burst of counter_clip, which lands on
      # its counter_strike_frame. The charged blow breaks the guard instead,
      # so the way past it is to wait it out or to gather one.
      - kind: parry
        clip: guard
        strike_frame: 5
        damage: 14
        hitbox_h: { x: -0.6, y: 0, width: 2.8, height: 2.6 }
        cooldown_s: 1.4
        windup_s: 0.3
        guard:
          hold_s: 1.2
          counter_clip: counter
          counter_strike_frame: 2
          counter_windup_s: 0.35
      - kind: telegraphed_lunge
        clip: lunge
        strike_frame: 5
        damage: 16
        hitbox_h: { x: 0, y: 0, width: 2.6, height: 1.3 }
        cooldown_s: 1.9
        windup_s: 0.55
      # Wind-up is the gathering before take-off; damage lands on touchdown.
      - kind: jump_slam
        clip: jump
        strike_frame: 2
        damage: 18
        hitbox_h: { x: -2, y: -1, width: 4, height: 3 }
        cooldown_s: 2.5
        windup_s: 0.6
    # What stops the chain from holding it in its flinch for good: wounded
    # after_wounds times with no armor up, it rolls distance_h through the
    # player and comes up at their back. No blow reaches it between
    # invulnerable_from_s and invulnerable_to_s of the roll: from its very
    # start, or the chain's next blow would stop it before it had moved.
    roll:
      after_wounds: 3
      distance_h: 4.5
      duration_s: 0.6
      invulnerable_from_s: 0
      invulnerable_to_s: 0.5
    phase_two:
      health_fraction_at_or_below: 0.5
      cooldown_multiplier: 0.75
  # The monsters: five types drawn from two packs (enemies/horror/ and
  # enemies/eye_beast/, listed clip by clip in assets/monster_sheets.rs).
  # They are not machines, and `polymer` only stands in for a flesh material
  # that has no sound yet. Every number here is a first guess, read off the
  # sheets rather than played. Each asks for one of the player's moves: the
  # brute's wave is jumped, the mage's patch is walked out of, the cat's
  # pounce is rolled through, and the ghost is met as it comes back.
  # An attack may open from further than its hitbox reaches
  # (`start_range_h`), and is passed over for the type's next one while the
  # player stands nearer than `min_range_h`.
  # `sprite` is how a type's sheets are laid over its body, in source pixels:
  # the world units a pixel is drawn at, the empty rows above and below the
  # figure in a frame, and how far above the feet the body's middle is (shots
  # leave from there).
  #
  # A brute that lashes far ahead of itself: slow, and its reach is the
  # danger. The lash lands on the frame its tendrils are fully out, and
  # carries on along the floor as a low wave: jump it, or roll through.
