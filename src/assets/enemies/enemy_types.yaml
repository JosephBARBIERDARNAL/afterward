        min_range_h: 2
        cooldown_s: 1.6
        windup_s: 0.45
      - kind: melee
        clip: attack
        strike_frame: 3
        damage: 6
        hitbox_h: { x: 0, y: 0, width: 0.59, height: 0.84 }
        cooldown_s: 0.9
        windup_s: 0.3
  # No platform is cover from it: with the player far off, or on another
