    hurtbox_h: { width: 0.98, height: 1.26 }
    health: 220
    material: polymer
    movement_speed_h_s: 1.4
    behavior: melee_pursuit
    sprite:
      {
        scale: 1.4,
        top_padding_px: 0,
        bottom_padding_px: 0,
        origin_above_feet_px: 24,
      }
    attack:
      kind: melee
      clip: attack
      strike_frame: 4
      damage: 14
      hitbox_h: { x: 0.28, y: 0, width: 2.03, height: 0.84 }
      cooldown_s: 2.4
      windup_s: 0.7
      shockwave:
        damage: 10
        speed_h_s: 7
        range_h: 6
        size_h: { width: 0.5, height: 0.4 }
  # It keeps its distance and sets the floor under the player alight: the
  # patch warns, then burns whoever is still standing in it. Standing still
  # is what it punishes, so it is the one to go for first.
  mage:
    hurtbox_h: { width: 0.42, height: 0.88 }
    health: 90
    material: polymer
    movement_speed_h_s: 1.6
    behavior: ranged_keep_distance
    sprite:
      {
        scale: 1.4,
        top_padding_px: 17,
        bottom_padding_px: 0,
        origin_above_feet_px: 15,
      }
    preferred_distance_h: { min: 4, max: 7.5 }
    attack:
      kind: hazard
      clip: attack
      strike_frame: 5
      damage: 14
      cooldown_s: 3.2
      windup_s: 0.8
      hazard:
        size_h: { width: 2.2, height: 1.6 }
        arm_s: 0.8
        burn_s: 0.35
  # Small, quick and frail. From a few H away it coils and pounces at where
  # the player stands, landing on them unless they have moved or rolled; up
  # close it bites.
  catto:
    hurtbox_h: { width: 0.49, height: 0.42 }
    health: 60
    material: polymer
    movement_speed_h_s: 4
    behavior: melee_pursuit
    sprite:
      {
        scale: 1.4,
        top_padding_px: 15,
        bottom_padding_px: 0,
        origin_above_feet_px: 7,
      }
    attacks:
      - kind: jump_slam
        clip: attack
        strike_frame: 2
        damage: 9
        hitbox_h: { x: -0.45, y: 0, width: 1.05, height: 0.84 }
        start_range_h: 4
        min_range_h: 2
        cooldown_s: 1.6
        windup_s: 0.45
      - kind: melee
        clip: attack
        strike_frame: 3
        damage: 6
        hitbox_h: { x: 0, y: 0, width: 0.59, height: 0.84 }
        cooldown_s: 0.9
        windup_s: 0.3
  # No platform is cover from it: with the player far off, or on another
  # floor, it fades out of where it stands and comes back at their back.
  # Then the claws come out; the slash is tall, and putting them away again
  # is the opening.
  mad_ghost:
    hurtbox_h: { width: 0.56, height: 1.01 }
    health: 120
    material: polymer
    movement_speed_h_s: 2.8
    behavior: melee_pursuit
    sprite:
      {
        scale: 1.4,
        top_padding_px: 27,
        bottom_padding_px: 0,
        origin_above_feet_px: 18,
      }
    attacks:
      - kind: blink
        clip: idle
        start_range_h: 9
        min_range_h: 3.5
        cooldown_s: 1.3
        windup_s: 0.6
      - kind: melee
        clip: attack
        strike_frame: 5
        damage: 12
        hitbox_h: { x: 0, y: 0, width: 0.84, height: 1.54 }
        cooldown_s: 1.4
        windup_s: 0.5
  # It keeps its distance and fires the void ball of its `shot` sheet, let go
  # on the frame the eye clears. It hangs a little off the floor: its
  # bottom_padding_px is 4 px short of the empty rows under it.
  eye_beast:
    hurtbox_h: { width: 0.7, height: 0.98 }
    health: 80
    material: polymer
    movement_speed_h_s: 1.8
    behavior: ranged_keep_distance
    preferred_distance_h: { min: 5, max: 8 }
    sprite:
      {
        scale: 1.4,
        top_padding_px: 17,
        bottom_padding_px: 6,
        origin_above_feet_px: 19,
      }
    attack:
      kind: projectile
      clip: attack
      strike_frame: 10
      damage: 8
      projectile_size_h: { width: 0.42, height: 0.35 }
      projectile_speed_h_s: 6
      cooldown_s: 1.8
      windup_s: 0.7
  # The four monsters of the horror pack again, in three other palettes each,
