# Player sprite sheets (Ozzbit Games "Male Hero Template", free version).
# Every sheet is a single row of equally sized frames. The character's body is
# `body_height_px` tall and stands on `feet_row_px` (rows counted from the top
# of a frame). It is drawn `body_height_h` tall, feet on the collision box's
# baseline; the collision box itself stays 1 H tall.
frame_size_px: { width: 128, height: 128 }
body_height_px: 32
feet_row_px: 80
body_height_h: 0.75
# Grounded movement switches from the walk to the run cycle at this fraction of
# the player's maximum speed.
run_speed_fraction: 0.6

clips:
  idle: { sheet: player/sheets/idle.png, frames: 10, fps: 8 }
  walk: { sheet: player/sheets/walk.png, frames: 10, fps: 12 }
  run: { sheet: player/sheets/run.png, frames: 10, fps: 14 }
  # The pack has no dash art: the dash replays the run cycle much faster.
  dash: { sheet: player/sheets/run.png, frames: 10, fps: 40 }
  # Rising part of a jump; holds its last frame until the player starts falling.
  jump: { sheet: player/sheets/jump.png, frames: 6, fps: 14 }
  # Apex-to-falling transition, then the falling loop.
  fall: { sheet: player/sheets/fall.png, frames: 4, fps: 12 }
  fall_loop: { sheet: player/sheets/fall_loop.png, frames: 3, fps: 8 }
  # The pack has no wall or ledge art: sliding down a wall slows the falling
  # loop, and mantling onto a ledge replays the jump rise quickly.
  wall_slide: { sheet: player/sheets/fall_loop.png, frames: 3, fps: 4 }
  ledge_climb: { sheet: player/sheets/jump.png, frames: 6, fps: 32 }

# One clip per sword-combo hit, in chain order (the pack's `combo_1` slash, then
# its `combo_1_end` follow-through as the finisher). Must have as many entries
# as `player.sword.combo.damage_multipliers` in config/gameplay.yaml.
sword_combo:
  - { sheet: player/sheets/sword_combo_1.png, frames: 3, fps: 12 }
  - { sheet: player/sheets/sword_combo_2.png, frames: 4, fps: 12 }
