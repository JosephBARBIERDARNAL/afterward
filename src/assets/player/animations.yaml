# Player sprite sheets (Craftpix "prototype hero" packs, copied into
# `player/sheets/`). Every sheet is a grid of equally sized frames. A clip
# reads `frames` frames from row `row` (default 0) of its sheet, starting at
# column `first_frame` (default 0), so several clips may share one sheet: the
# jump's take-off and its rising loop are both cut out of `jump.png`, and the
# fall and the landing out of `fall.png`. The character's body is
# `body_height_px` tall and stands on `feet_row_px` (rows counted from the top
# of a frame). It is drawn `body_height_h` tall, feet on the collision box's
# baseline; the collision box itself stays 1 H tall.
frame_size_px: { width: 128, height: 128 }
body_height_px: 68
feet_row_px: 128
body_height_h: 0.75
# Grounded movement switches from the walk to the jog cycle at this fraction of
# the player's maximum speed.
jog_speed_fraction: 0.6
# Below this fraction of maximum health the idle becomes the wounded idle.
wounded_health_fraction: 0.25
# Standing idle this long plays a hand fidget (alternating left and right),
# then the timer starts over.
idle_fidget_after_s: 4

clips:
  # Standing still: the guard breathing slowly, quicker while enemies are up,
  # then a held flinch once badly hurt.
  idle: { sheet: player/sheets/guard.png, frames: 2, fps: 2 }
  idle_alert: { sheet: player/sheets/guard.png, frames: 2, fps: 6 }
  idle_wounded: { sheet: player/sheets/hurt.png, first_frame: 2, frames: 1, fps: 1 }
  idle_fidget_left: { sheet: player/sheets/idle_fidget_left.png, frames: 5, fps: 8 }
  idle_fidget_right: { sheet: player/sheets/idle_fidget_right.png, frames: 5, fps: 8 }
  walk: { sheet: player/sheets/walk.png, frames: 12, fps: 12 }
  jog: { sheet: player/sheets/jog.png, frames: 12, fps: 16 }
  # Holding Down on the ground: the crouch plays down and holds its last
  # frame, which the crouch walk shuffles along on.
  crouch: { sheet: player/sheets/crouch.png, frames: 3, fps: 12 }
  crouch_walk: { sheet: player/sheets/crouch.png, first_frame: 2, frames: 1, fps: 1 }
  # Take-off, then the rising loop until the player starts falling.
  jump: { sheet: player/sheets/jump.png, frames: 6, fps: 24 }
  ascend: { sheet: player/sheets/jump.png, first_frame: 6, frames: 2, fps: 8 }
  # Falling, then touching down: both cut out of the landing sheet, whose
  # first frames are airborne and whose last ones kick up dust.
  descend: { sheet: player/sheets/fall.png, first_frame: 4, frames: 2, fps: 8 }
  land: { sheet: player/sheets/fall.png, first_frame: 6, frames: 7, fps: 20 }
  # Clinging to a wall, then pushing off it.
  wall_slide: { sheet: player/sheets/wall_jump.png, frames: 2, fps: 6 }
  wall_jump: { sheet: player/sheets/wall_jump.png, first_frame: 2, frames: 2, fps: 16 }
  # Entering water from above, then the stroke that carries the player
  # through it.
  dive: { sheet: player/sheets/dive.png, frames: 9, fps: 16 }
  swim: { sheet: player/sheets/swim.png, frames: 14, fps: 14 }
  # Raising the guard; holds its last frame while Cover is held.
  cover: { sheet: player/sheets/cover.png, frames: 12, fps: 20 }
  hit: { sheet: player/sheets/hit.png, frames: 3, fps: 14 }
  death: { sheet: player/sheets/death.png, frames: 5, fps: 9 }
  # The melee chain, in the order the steps of `player.melee` of
  # `config/gameplay.yaml` call for them. The last four are finishers: a run
  # throws whichever one of them its bonuses bought.
  strike_1: { sheet: player/sheets/strike_1.png, frames: 7, fps: 24 }
  strike_2: { sheet: player/sheets/strike_2.png, frames: 8, fps: 24 }
  kick: { sheet: player/sheets/kick.png, frames: 5, fps: 18 }
  power_strike: { sheet: player/sheets/power_strike.png, frames: 11, fps: 26 }
  fire_kick: { sheet: player/sheets/fire_kick.png, frames: 11, fps: 26 }
  explosive_strike: { sheet: player/sheets/explosive_strike.png, frames: 9, fps: 22 }
  # Attack with Down held in mid-air: the drop, then the floor it breaks.
  ground_slam: { sheet: player/sheets/ground_slam.png, frames: 12, fps: 24 }
  # Down and Jump together on the ground: a roll that nothing can hit through
  # its middle.
  roll: { sheet: player/sheets/roll.png, frames: 9, fps: 18 }
  # Attack held rather than tapped: the gather, then the brace it is thrown
  # from. The charge loops until the key goes.
  charge: { sheet: player/sheets/charge.png, frames: 6, fps: 12 }
  charge_brace: { sheet: player/sheets/charge_brace.png, frames: 10, fps: 16 }
  # Healing, by where it comes from: a flask off the floor, and the glow of a
  # bonus that heals a cleared room.
  drink: { sheet: player/sheets/drink.png, frames: 8, fps: 14 }
  healing: { sheet: player/sheets/healing.png, frames: 8, fps: 14 }
  # Getting up off the floor again, which only Last Stand ever asks for.
  rise: { sheet: player/sheets/rise.png, frames: 8, fps: 10 }
  # Planting the decoy that enemies swing at.
  summon: { sheet: player/sheets/summon.png, frames: 8, fps: 16 }
  # Going into a door and coming out of the next one.
  dissolve: { sheet: player/sheets/dissolve.png, frames: 6, fps: 14 }
  materialize: { sheet: player/sheets/materialize.png, frames: 6, fps: 14 }
  # The aura worn for a moment when a bonus is taken, one per category; the
  # defensive one is the guard's own sheet, played through once.
  aura_combat: { sheet: player/sheets/aura_combat.png, frames: 10, fps: 18 }
  aura_agility: { sheet: player/sheets/aura_agility.png, frames: 6, fps: 14 }
  aura_intelligence: { sheet: player/sheets/aura_intelligence.png, frames: 10, fps: 18 }
  aura_defense: { sheet: player/sheets/cover.png, frames: 12, fps: 20 }
